<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Biswajit Jana - Astrophysics Portfolio</title>
  <desc id="desc">Social preview card for a portfolio covering exoplanet instrumentation, spectroscopy, and scientific computing.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06111d" stop-opacity="0.99"/>
      <stop offset="48%" stop-color="#06111d" stop-opacity="0.88"/>
      <stop offset="74%" stop-color="#06111d" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#06111d" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#20c8ed"/>
      <stop offset="55%" stop-color="#397cff"/>
      <stop offset="100%" stop-color="#ffb26e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="canvas">
      <rect width="1280" height="640" rx="0"/>
    </clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <image xlink:href="01_hero_space_observatory.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1280" height="640" fill="url(#fade)"/>
    <rect x="42" y="42" width="1196" height="556" rx="22" fill="none" stroke="#47dbff" stroke-opacity="0.25"/>
    <rect x="64" y="71" width="134" height="32" rx="16" fill="#092638" stroke="#3ad2f2" stroke-opacity="0.62"/>
    <text x="131" y="93" fill="#6be4ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2" text-anchor="middle">PORTFOLIO</text>
    <rect x="65" y="138" width="82" height="5" rx="2.5" fill="url(#edge)"/>
    <text x="64" y="224" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">Biswajit Jana</text>
    <text x="68" y="276" fill="#5bdcff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3">ASTROPHYSICS  |  INSTRUMENTATION</text>
    <text x="66" y="358" fill="#e9f2fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400">Exoplanet spectroscopy, optical systems,</text>
    <text x="66" y="395" fill="#e9f2fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400">feedback control and scientific computing</text>
    <g transform="translate(66 459)">
      <rect width="145" height="42" rx="21" fill="#0a2234" stroke="#22caea" stroke-opacity="0.6"/>
      <text x="72.5" y="27" fill="#ccefff" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">EXOhSPEC</text>
      <rect x="159" width="201" height="42" rx="21" fill="#0a2234" stroke="#22caea" stroke-opacity="0.38"/>
      <text x="259.5" y="27" fill="#ccefff" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">Interactive Science</text>
    </g>
    <text x="66" y="556" fill="#b7cedd" font-family="Segoe UI, Arial, sans-serif" font-size="17">biswajit1999.github.io/Biswajit_Jana.github.io</text>
    <circle cx="1176" cy="548" r="10" fill="#32ddfb" filter="url(#shadow)" opacity="0.8"/>
    <circle cx="1176" cy="548" r="4" fill="#c4f7ff"/>
  </g>
</svg>
