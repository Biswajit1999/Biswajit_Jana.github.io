name: Refresh public research index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Refresh the crawlable repository snapshot
        run: python build_search_index.py
      - name: Rebuild atlas with the current public count
        run: python build_atlas.py
      # Keep the scheduled refresh useful without authoring commits as a bot.
      # Public pages also refresh their repository catalogue in the browser.
      - name: Save refreshed discovery files for author review
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-research-index
          path: |
            data/public-repositories.json
            research-index.html
            atlas.html
          retention-days: 7
