<script>
const P=[['zhao-2026-expres-hidden-systematics','Uncovering Hidden Systematics in Extreme-Precision Radial Velocity Measurements','Zhao et al.','2026','ePRV Systematics','ApJS accepted · arXiv:2601.02296','19 min · 7 figures','EXPRES shows why long-baseline instrument telemetry is not optional.','A hidden 2.8 m/s EXPRES instrumental trend is recovered through multi-star stacking, solar comparison, comb-line diagnostics and echellogram tracking.','jpg','https://arxiv.org/abs/2601.02296'],['pepe-2021-espresso-performance','ESPRESSO@VLT: On-Sky Performance and First Results','Pepe et al.','2021','Spectrograph Design','A&A 645, A96 · arXiv:2010.00316','33 min · 20 figures','ESPRESSO as an engineering baseline for EPRV spectrograph design.','A reference architecture for precision radial-velocity instrumentation: vacuum vessel, thermal shells, fibre scrambling and calibration delivery.','jpg','https://arxiv.org/abs/2010.00316'],['schmidt-2026-eom-comb-espresso','Test of a 34 GHz EOM Laser Frequency Comb at ESPRESSO','Schmidt et al.','2026','Laser Frequency Comb','arXiv:2603.17908','21 min · 6 figures','A comb test that also diagnoses calibration-injection systematics.','The EOM comb result is technically strong, but the deeper lesson is calibration-unit mismatch in a real operational spectrograph.','jpg','https://arxiv.org/abs/2603.17908'],['kreider-2025-fabry-perot-chromatic-drift','Quantification of Broadband Chromatic Drifts in Fabry–Pérot Resonators for Exoplanet Science','Kreider et al.','2025','Calibration','Nature Astronomy · arXiv:2210.10988','14 min · 4 figures','Why Fabry-Perot etalons are not simple achromatic rulers.','White-light Fabry-Perot etalons are convenient dense calibration sources, but their drift can be chromatic and linked to mirror-coating changes.','jpg','https://arxiv.org/abs/2210.10988'],['sercel-2024-thermal-control-delay-lines','Thermal Control of Long Delay Lines in a High-Resolution Astrophotonic Spectrograph','Sercel et al.','2024','Thermal Control','SPIE · arXiv:2403.10019','15 min · 5 figures','A compact thermal-control paper with a clear tolerance chain.','A silicon-nitride astrophotonic FTS needs long delay-line stability, making temperature control a direct optical-path-length requirement.','jpg','https://arxiv.org/abs/2403.10019'],['khandelwal-2024-scmos-detectors','Beyond CCDs: Characterization of sCMOS Detectors for Optical Astronomy','Khandelwal et al.','2024','Detectors','SPIE · arXiv:2409.16449','17 min · 6 figures','A careful imaging detector paper, but not yet an EPRV detector proof.','Modern sCMOS detectors are attractive as CCD supply declines, but precision spectroscopy needs extra tests beyond standard imaging characterisation.','jpg','https://arxiv.org/abs/2409.16449'],['luhman-2025-ic348-h-class-brown-dwarfs','A New Spectral Class of Brown Dwarfs at the Bottom of the IMF in IC 348','Luhman & Alves de Oliveira','2025','Brown Dwarfs','ApJ Letters · arXiv:2506.08969','18 min · 7 figures','A JWST discovery note that should stay cautious about the proposed H class.','JWST/NIRSpec reveals a broad 3.4 micron feature in very low-mass IC 348 objects, raising classification and opacity questions.','png','https://arxiv.org/abs/2506.08969'],['chen-2025-cosmos-web-brown-dwarf-density','Brown Dwarf Number Density in the JWST COSMOS-Web Field','Chen et al.','2025','Brown Dwarfs','PASA · arXiv:2503.18510','18 min · 7 figures','A photometric census paper that needs explicit confirmation and completeness boundaries.','COSMOS-Web photometry turns late-T/Y dwarf selection into a kpc-scale Galactic-structure problem, but spectroscopy and completeness remain key limitations.','jpg','https://arxiv.org/abs/2503.18510']].map(x=>({slug:x[0],title:x[1],short:x[2],year:x[3],theme:x[4],venue:x[5],read:x[6],subtitle:x[7],summary:x[8],ext:x[9],source:x[10]}));

P.unshift(...[{"slug": "schmidt2024-espresso-line-spread-function", "title": "Characterization of the ESPRESSO Line-Spread Function and Improvement of the Wavelength Calibration Accuracy", "short": "Schmidt & Bouchy", "year": "2024", "theme": "Calibration", "venue": "A&A · arXiv:2404.05283v1", "read": "7 source figures · full-text reading", "subtitle": "Why measuring the shape of a spectral line matters as much as measuring its centre.", "summary": "A direct bridge from EXOhSPEC-style detector tracking to the distinction between image stability and wavelength accuracy.", "ext": "webp", "source": "https://arxiv.org/abs/2404.05283", "featuredTitle": "ESPRESSO: beyond a Gaussian line profile"}, {"slug": "robertson-2019-neid-environment-control", "title": "Ultra-Stable Environment Control for the NEID Spectrometer: Design and Performance Demonstration", "short": "Robertson et al.", "year": "2019", "theme": "Thermal Control", "venue": "JATIS 5, 015003", "read": "6 source figures · full-text reading", "subtitle": "Reading sub-millikelvin stability as a system result, not just a quiet thermometer trace.", "summary": "Thermal isolation, independent thermometry, and long-timescale disturbances connect directly to spectrograph feedback-control work.", "ext": "webp", "source": "https://arxiv.org/abs/1902.07729"}, {"slug": "pinfield-2014-wise-halo-t-dwarfs", "title": "A Deep WISE Search for Very Late Type Objects and the Discovery of Two Halo/Thick-Disk T Dwarfs", "short": "Pinfield et al.", "year": "2014", "theme": "Brown Dwarfs", "venue": "MNRAS 437, 1009–1026 · preprint 2013", "read": "6 source figures · full-text reading", "subtitle": "From faint W2-only candidates to spectra, motion, and a carefully qualified population assignment.", "summary": "A methodological precursor to my halo T-dwarf candidate work with VISTA, DES, and WISE—not a paper I co-authored.", "ext": "webp", "source": "https://arxiv.org/abs/1308.0495"}, {"slug": "molliere-2019-petitradtrans", "title": "petitRADTRANS: A Python Radiative Transfer Package for Exoplanet Characterization and Retrieval", "short": "Mollière et al.", "year": "2019", "theme": "Atmospheres", "venue": "A&A 627, A67", "read": "5 source figures · full-text reading", "subtitle": "Following the forward model from opacity and atmospheric structure to a spectrum—and asking what a retrieval can really constrain.", "summary": "Connects my Sagan workshop training and brown-dwarf atmosphere interests with explicit model verification and inference limits.", "ext": "webp", "source": "https://arxiv.org/abs/1904.11504"}, {"slug": "kreidberg-2015-batman-transit-models", "title": "batman: BAsic Transit Model cAlculatioN in Python", "short": "Kreidberg", "year": "2015", "theme": "Transit Modelling", "venue": "PASP 127, 1161", "read": "3 source figures · full-text reading", "subtitle": "How radial symmetry turns a transit calculation into a fast, testable numerical model.", "summary": "A natural methodological reference for ExoLight Transit Lab, limb darkening, finite exposures, and injection–recovery validation.", "ext": "webp", "source": "https://arxiv.org/abs/1507.08285"}]);

function e(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function img(p,t){return `papers/${p.slug}/${t}.${p.ext}`}function link(p){return `papers/${p.slug}/`}
const b=document.getElementById('themeBtn');if(localStorage.theme==='light'){document.body.classList.add('light');b.textContent='☀'}b.onclick=()=>{document.body.classList.toggle('light');localStorage.theme=document.body.classList.contains('light')?'light':'dark';b.textContent=document.body.classList.contains('light')?'☀':'☾'};
function home(){let f=P[0];app.innerHTML=`<section class="hero"><div class="container hero-grid"><div class="hero-copy box"><div class="kicker">Research Reading Journal</div><h1>Reading papers actively, not passively.</h1><p class="lead">Extended readings on instruments, brown dwarfs, calibration, detectors, atmospheres and transit modelling—with methods, assumptions, source plots and figure-by-figure explanations. Each note asks what the paper proves, what remains uncertain, and how it connects to the research questions I want to pursue.</p><p class="journal-completeness">13 expanded readings · 89 paper figures · source-linked commentary</p><div class="toolbar"><input id="q" aria-label="Search reading notes" placeholder="Search papers, authors, topics..."><select id="f" aria-label="Filter reading notes by theme"><option value="all">All themes</option>${[...new Set(P.map(p=>p.theme))].sort().map(t=>`<option>${e(t)}</option>`).join('')}</select></div></div><div class="hero-img box"><img src="assets/images/journal-hero.jpg" alt="Research journal"></div></div></section><section class="feature"><div class="container"><article class="featured box"><a class="featured-img" href="${link(f)}"><img src="${img(f,'card')}" alt="${e(f.title)}"></a><div class="featured-body"><div class="kicker">Featured reading note</div><h2>${e(f.featuredTitle||f.title)}</h2><p>${e(f.summary)}</p><div class="pills"><span class="pill">${e(f.theme)}</span><span class="pill">${e(f.short)} ${e(f.year)}</span><span class="pill">${e(f.read)}</span></div><a class="button" href="${link(f)}">Read note →</a></div></article></div></section><section class="archive"><div class="container"><div class="head"><div><div class="kicker">All notes</div><h2>Paper archive</h2></div><p>Each article opens into a standalone reading note with motivation, technical argument, open questions, research connection and a guide to the source figures.</p></div><div id="grid" class="grid"></div></div></section>`;let q=document.getElementById('q'),filt=document.getElementById('f');function draw(){let s=q.value.toLowerCase(),c=filt.value;let items=P.filter(p=>(c==='all'||p.theme===c)&&[p.title,p.short,p.theme,p.summary].join(' ').toLowerCase().includes(s));grid.innerHTML=items.map(p=>`<article class="card box"><a class="thumb" href="${link(p)}"><img src="${img(p,'card')}" alt="${e(p.title)}"></a><div class="body"><div class="meta"><span>${e(p.theme)}</span><span>${e(p.read)}</span></div><h3>${e(p.title)}</h3><p>${e(p.subtitle)}</p><div class="tags"><span class="tag">${e(p.short)} ${e(p.year)}</span><span class="tag">Paper note</span></div><a class="read" href="${link(p)}">Read note →</a></div></article>`).join('')||'<p role="status">No notes match this search. Try another topic or select all themes.</p>'}q.oninput=draw;filt.onchange=draw;draw()}
let slug=new URLSearchParams(location.search).get('paper')||location.pathname.split('/').filter(Boolean).pop();let p=P.find(x=>x.slug===slug);if(p){const target=new URL(link(p),location.href);const appearance=new URLSearchParams(location.search).get('appearance');if(appearance)target.searchParams.set('appearance',appearance);location.replace(target.href)}else{home()}
