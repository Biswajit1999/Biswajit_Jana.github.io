<style>
:root{--bg:#030711;--bg2:#081426;--panel:rgba(9,20,39,.86);--text:#f5f8ff;--muted:#bdc8db;--dim:#8391aa;--a:#43efd0;--gold:#ffd072;--line:rgba(220,238,255,.13);--shadow:0 28px 85px rgba(0,0,0,.38);--display:'Playfair Display',Georgia,serif;--mono:'JetBrains Mono',monospace;--sans:Inter,system-ui,sans-serif}body.light{--bg:#f8fbff;--bg2:#edf4ff;--panel:rgba(255,255,255,.88);--text:#0d172a;--muted:#41536d;--dim:#65748a;--a:#008d7f;--gold:#9a6300;--line:rgba(10,30,60,.14);--shadow:0 22px 58px rgba(35,70,115,.15)}*{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--text);background:radial-gradient(circle at 12% 0,rgba(67,239,208,.15),transparent 30%),radial-gradient(circle at 82% 4%,rgba(143,179,255,.14),transparent 30%),linear-gradient(180deg,var(--bg),var(--bg2) 60%,#02050d);line-height:1.65;overflow-x:hidden}body.light{background:linear-gradient(180deg,#f9fbff,#eef4ff 70%,#fff)}#simBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-2;opacity:.72}body.light #simBg{opacity:.38}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:62px 62px}.container{width:min(1380px,92%);margin:auto}a{color:inherit;text-decoration:none}nav{position:sticky;top:0;z-index:10;background:rgba(3,7,17,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}body.light nav{background:rgba(249,251,255,.9)}.nav{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand span,.active,.kicker,.read{color:var(--a)}.links{display:flex;gap:18px;align-items:center;list-style:none;margin:0;padding:0}.links a{font-size:.82rem;font-weight:850;color:var(--muted)}.links a:hover{color:var(--a)}.switch{width:56px;height:28px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;cursor:pointer;background:transparent;color:var(--gold)}.hero{padding:72px 0 44px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:28px}.box{border:1px solid var(--line);background:var(--panel);border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}.hero-copy{padding:clamp(34px,4.5vw,64px);display:flex;flex-direction:column;justify-content:center}.kicker{font:900 .72rem var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}h1,h2{font-family:var(--display);letter-spacing:-.05em;line-height:.98;margin:0}h1{font-size:clamp(3.2rem,5.4vw,6.3rem);margin-bottom:20px}.lead{color:var(--muted);font-size:1.08rem;max-width:790px}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-top:30px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:15px;padding:14px 15px;background:rgba(5,12,24,.72);color:var(--text);font:inherit}body.light .toolbar input,body.light .toolbar select{background:white}.hero-img{min-height:500px;position:relative;padding:12px}.hero-img img{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block}.hero-img:after{content:"Paper notes · instrumentation · brown dwarfs · calibration · methods";position:absolute;left:34px;right:34px;bottom:32px;color:white;font:900 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase}.feature{padding:12px 0 32px}.featured{display:grid;grid-template-columns:.98fr 1.02fr}.featured-img{min-height:410px;background:rgba(255,255,255,.04);display:block}.featured-img img,.paper-hero img{width:100%;height:100%;object-fit:cover;display:block}.featured-body{padding:clamp(30px,4vw,54px);display:flex;flex-direction:column;justify-content:center}.featured-body h2{font-size:clamp(2.2rem,4vw,4rem);margin-bottom:16px}.featured-body p,.article p,.article li{color:var(--muted)}.pills,.tags{display:flex;gap:8px;flex-wrap:wrap}.pill,.tag{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--dim);font:800 .68rem var(--mono);background:rgba(255,255,255,.035)}.button{display:inline-flex;width:max-content;margin-top:18px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,var(--a),#dffff7);color:#001715;font:950 .76rem var(--mono)}.archive{padding:22px 0 86px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.head h2{font-size:clamp(2rem,3vw,3.2rem)}.head p{max-width:590px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{position:relative;min-height:430px;transition:.25s;background:#07101e}.card:hover{transform:translateY(-6px);border-color:rgba(67,239,208,.35)}.thumb{position:absolute;inset:0;display:block}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 0%,rgba(0,0,0,.16) 38%,rgba(2,7,17,.92) 100%);pointer-events:none}.body{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:20px;display:flex;flex-direction:column}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--a);font:850 .68rem var(--mono);margin-bottom:10px}.card h3{font-size:1.16rem;line-height:1.25;margin:0 0 9px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.65)}.card p{color:#cbd7eb;font-size:.9rem;margin:0 0 12px;text-shadow:0 2px 12px rgba(0,0,0,.65)}.card .tag{color:#bfffee;background:rgba(3,7,17,.55);border-color:rgba(67,239,208,.22)}.read{margin-top:12px;font-weight:900;font-size:.85rem}.article-hero{padding:62px 0 24px}.back{font:900 .74rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--a)}.paper-top{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;margin-top:20px}.paper-copy{padding:clamp(30px,4vw,52px)}.paper-copy h1{font-size:clamp(2.4rem,5vw,4.4rem)}.paper-hero{min-height:430px}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;padding:20px 0 80px}.side{padding:20px;align-self:start;position:sticky;top:82px}.mini{border-bottom:1px solid var(--line);padding:0 0 11px;margin-bottom:11px;color:var(--muted);font-size:.9rem}.mini strong{display:block;color:var(--text);font:900 .72rem var(--mono);letter-spacing:.11em;text-transform:uppercase}.stack{display:grid;gap:20px}.article{padding:clamp(24px,3vw,38px)}.article h2{font-size:clamp(1.8rem,3vw,2.55rem);margin-bottom:14px}.quote{border-left:3px solid var(--a);padding:12px 0 12px 18px;color:var(--text);font-style:italic;background:linear-gradient(90deg,rgba(67,239,208,.06),transparent)}.plots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.plot{border:1px dashed rgba(67,239,208,.28);border-radius:18px;padding:16px;background:rgba(67,239,208,.04)}.placeholder{height:136px;border-radius:14px;background:linear-gradient(135deg,rgba(67,239,208,.12),rgba(143,179,255,.08));display:grid;place-items:center;color:var(--a);font:900 .72rem var(--mono);text-transform:uppercase;margin-bottom:12px}footer{padding:30px 0 44px;text-align:center;color:var(--dim);border-top:1px solid var(--line);font-size:.88rem}@media(max-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}.container{width:min(1180px,92%)}}@media(max-width:980px){.hero-grid,.featured,.grid,.paper-top,.layout{grid-template-columns:1fr}.side{position:static}.hero-img{min-height:330px}.plots{grid-template-columns:1fr}}@media(max-width:680px){.nav{height:auto;padding:12px 0;align-items:flex-start}.links{gap:12px}.hero{padding-top:42px}.toolbar{grid-template-columns:1fr}.head{display:block}.card{min-height:430px}h1{font-size:3rem}}
</style>
</head>
<body><canvas id="simBg"></canvas><nav><div class="container nav"><a class="brand" href="../index.html">Biswajit <span>Jana</span></a><ul class="links"><li><a href="../index.html">Home</a></li><li><a href="../cv.html">CV</a></li><li><a href="../publications.html">Publications</a></li><li><a class="active" href="index.html">Reading Journal</a></li><li><a href="../blog/index.html">Blog</a></li><li><button class="switch" id="themeBtn">☾</button></li></ul></div></nav><main id="app"></main><footer>© 2026 Biswajit Jana · Research Reading Journal</footer>
<script>
const P=[['zhao-2026-expres-hidden-systematics','Uncovering Hidden Systematics in Extreme-Precision Radial Velocity Measurements','Zhao et al.','2026','ePRV Systematics','ApJS · arXiv:2601.02296','14 min read','EXPRES shows why long-baseline instrument telemetry is not optional.','A hidden 2.8 m/s EXPRES instrumental trend is recovered through multi-star stacking, solar comparison, comb-line diagnostics and echellogram tracking.','jpg','https://arxiv.org/abs/2601.02296'],['pepe-2021-espresso-performance','ESPRESSO@VLT: On-Sky Performance and First Results','Pepe et al.','2021','Spectrograph Design','A&A 645, A96 · arXiv:2010.00316','13 min read','ESPRESSO as an engineering baseline for EPRV spectrograph design.','A reference architecture for precision radial-velocity instrumentation: vacuum vessel, thermal shells, fibre scrambling and calibration delivery.','jpg','https://arxiv.org/abs/2010.00316'],['schmidt-2026-eom-comb-espresso','Test of a 34 GHz EOM Laser Frequency Comb at ESPRESSO','Schmidt et al.','2026','Laser Frequency Comb','arXiv:2603.17908','12 min read','A comb test that also diagnoses calibration-injection systematics.','The EOM comb result is technically strong, but the deeper lesson is calibration-unit mismatch in a real operational spectrograph.','jpg','https://arxiv.org/abs/2603.17908'],['kreider-2025-fabry-perot-chromatic-drift','Quantifying Broadband Chromatic Drifts in Fabry-Perot Resonators for Exoplanet Science','Kreider et al.','2025','Calibration','Nature Astronomy · arXiv:2210.10988','13 min read','Why Fabry-Perot etalons are not simple achromatic rulers.','White-light Fabry-Perot etalons are convenient dense calibration sources, but their drift can be chromatic and linked to mirror-coating changes.','jpg','https://arxiv.org/abs/2210.10988'],['sercel-2024-thermal-control-delay-lines','Thermal Control of Long Delay Lines in a High-Resolution Astrophotonic Spectrograph','Sercel et al.','2024','Thermal Control','SPIE · arXiv:2403.10019','11 min read','A compact thermal-control paper with a clear tolerance chain.','A silicon-nitride astrophotonic FTS needs long delay-line stability, making temperature control a direct optical-path-length requirement.','jpg','https://arxiv.org/abs/2403.10019'],['khandelwal-2024-scmos-detectors','Beyond CCDs: Characterization of sCMOS Detectors for Optical Astronomy','Khandelwal et al.','2024','Detectors','SPIE · arXiv:2409.16449','12 min read','A careful imaging detector paper, but not yet an EPRV detector proof.','Modern sCMOS detectors are attractive as CCD supply declines, but precision spectroscopy needs extra tests beyond standard imaging characterisation.','jpg','https://arxiv.org/abs/2409.16449'],['luhman-2025-ic348-h-class-brown-dwarfs','A New Spectral Class of Brown Dwarfs at the Bottom of the IMF in IC 348','Luhman & Alves de Oliveira','2025','Brown Dwarfs','ApJ Letters · arXiv:2506.08969','12 min read','A JWST discovery note that should stay cautious about the proposed H class.','JWST/NIRSpec reveals a broad 3.4 micron feature in very low-mass IC 348 objects, raising classification and opacity questions.','png','https://arxiv.org/abs/2506.08969'],['chen-2025-cosmos-web-brown-dwarf-density','Brown Dwarf Number Density in the JWST COSMOS-Web Field','Chen et al.','2025','Brown Dwarfs','PASA · arXiv:2503.18510','12 min read','A photometric census paper that needs explicit confirmation and completeness boundaries.','COSMOS-Web photometry turns late-T/Y dwarf selection into a kpc-scale Galactic-structure problem, but spectroscopy and completeness remain key limitations.','jpg','https://arxiv.org/abs/2503.18510']].map(x=>({slug:x[0],title:x[1],short:x[2],year:x[3],theme:x[4],venue:x[5],read:x[6],subtitle:x[7],summary:x[8],ext:x[9],source:x[10]}));
function e(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function img(p,t){return `papers/${p.slug}/${t}.${p.ext}`}function link(p){return `papers/${p.slug}/`}
const b=document.getElementById('themeBtn');if(localStorage.theme==='light'){document.body.classList.add('light');b.textContent='☀'}b.onclick=()=>{document.body.classList.toggle('light');localStorage.theme=document.body.classList.contains('light')?'light':'dark';b.textContent=document.body.classList.contains('light')?'☀':'☾'};
function home(){let f=P[0];app.innerHTML=`<section class="hero"><div class="container hero-grid"><div class="hero-copy box"><div class="kicker">Research Reading Journal</div><h1>Reading papers actively, not passively.</h1><p class="lead">Close-reading notes on instruments, brown dwarfs, calibration systems, detectors and the papers shaping my PhD direction. Each note asks what the paper proves, what remains uncertain, and how it connects to the research questions I want to pursue.</p><div class="toolbar"><input id="q" placeholder="Search papers, authors, topics..."><select id="f"><option value="all">All themes</option>${[...new Set(P.map(p=>p.theme))].sort().map(t=>`<option>${e(t)}</option>`).join('')}</select></div></div><div class="hero-img box"><img src="assets/images/journal-hero.jpg" alt="Research journal"></div></div></section><section class="feature"><div class="container"><article class="featured box"><a class="featured-img" href="${link(f)}"><img src="${img(f,'card')}" alt="${e(f.title)}"></a><div class="featured-body"><div class="kicker">Featured reading note</div><h2>${e(f.title)}</h2><p>${e(f.summary)}</p><div class="pills"><span class="pill">${e(f.theme)}</span><span class="pill">${e(f.short)} ${e(f.year)}</span><span class="pill">${e(f.read)}</span></div><a class="button" href="${link(f)}">Read note →</a></div></article></div></section><section class="archive"><div class="container"><div class="head"><div><div class="kicker">All notes</div><h2>Paper archive</h2></div><p>Each article opens into a standalone reading note with motivation, technical argument, open questions, research connection and figure plan.</p></div><div id="grid" class="grid"></div></div></section>`;let q=document.getElementById('q'),filt=document.getElementById('f');function draw(){let s=q.value.toLowerCase(),c=filt.value;let items=P.filter(p=>(c==='all'||p.theme===c)&&[p.title,p.short,p.theme,p.summary].join(' ').toLowerCase().includes(s));grid.innerHTML=items.map(p=>`<article class="card box"><a class="thumb" href="${link(p)}"><img src="${img(p,'card')}" alt="${e(p.title)}"></a><div class="body"><div class="meta"><span>${e(p.theme)}</span><span>${e(p.read)}</span></div><h3>${e(p.title)}</h3><p>${e(p.subtitle)}</p><div class="tags"><span class="tag">${e(p.short)} ${e(p.year)}</span><span class="tag">Paper note</span></div><a class="read" href="${link(p)}">Read note →</a></div></article>`).join('')}q.oninput=draw;filt.onchange=draw;draw()}
function article(p){app.innerHTML=`<header class="article-hero container"><a class="back" href="index.html">← Back to journal</a><div class="paper-top"><div class="paper-copy box"><div class="pills"><span class="pill">${e(p.theme)}</span><span class="pill">${e(p.short)} ${e(p.year)}</span><span class="pill">${e(p.read)}</span></div><h1>${e(p.title)}</h1><p class="lead">${e(p.subtitle)}</p></div><div class="paper-hero box"><img src="${img(p,'hero')}" alt="${e(p.title)}"></div></div></header><main class="container layout"><aside class="side box"><h3>Paper details</h3><div class="mini"><strong>Authors</strong>${e(p.short)}</div><div class="mini"><strong>Venue</strong>${e(p.venue)}</div><div class="mini"><strong>Theme</strong>${e(p.theme)}</div><div class="mini"><strong>Source</strong><a style="color:var(--a)" href="${e(p.source)}" target="_blank">Original paper</a></div></aside><div class="stack"><section class="article box"><h2>Why I selected this paper</h2><p>I selected this paper because it connects directly to the research direction I want to build around instrumentation, calibration, detectors, or brown-dwarf discovery.</p><p>The note focuses on what the paper demonstrates, what remains uncertain, and how the gap could become a useful PhD-level question.</p></section><section class="article box"><h2>Core idea</h2><p>${e(p.summary)}</p><p>My reading focuses on the assumptions behind the method, the diagnostics that support the conclusion, and what would need to be tested next.</p></section><section class="article box"><h2>Technical notes</h2><p>The strongest part is the chain between measurement, physical interpretation and uncertainty.</p><p>The next improvement is to add recreated plots and paper-specific equations so the note becomes closer to a publication-quality technical review.</p></section><section class="article box"><h2>Questions this paper leaves me with</h2><ul><li>What assumption would fail first under a different instrument, sample or observing condition?</li><li>Which additional diagnostic would make the conclusion harder to dispute?</li></ul></section><section class="article box"><h2>Connection to my research direction</h2><p>This note connects to my broader interest in precision spectrographs, optical path stability, calibration strategy, detector behaviour and brown-dwarf surveys.</p><div class="quote">A useful cold-email angle is to ask a narrow technical question about the remaining uncertainty, not to simply praise the paper.</div></section><section class="article box"><h2>Figures and plots to add</h2><div class="plots">${['Main result diagram','Diagnostic or calibration plot','Limitation / uncertainty schematic','Connection to my work'].map((x,i)=>`<div class="plot"><div class="placeholder">Plot ${i+1}</div><p>${x}</p></div>`).join('')}</div></section></div></main>`}
let slug=new URLSearchParams(location.search).get('paper')||location.pathname.split('/').filter(Boolean).pop();let p=P.find(x=>x.slug===slug);p?article(p):home();
(function(){const c=document.getElementById('simBg'),x=c.getContext('2d');let st=[];function r(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);st=Array.from({length:120},()=>({a:Math.random()*innerWidth,b:Math.random()*innerHeight,v:Math.random()*.25+.04,z:Math.random()*1.4+.3}))}function d(){x.clearRect(0,0,innerWidth,innerHeight);let l=document.body.classList.contains('light');for(const s of st){s.b+=s.v;if(s.b>innerHeight)s.b=0;x.fillStyle=l?'rgba(0,80,120,.18)':'rgba(220,245,255,.42)';x.beginPath();x.arc(s.a,s.b,s.z,0,7);x.fill()}for(let k=0;k<5;k++){let y=innerHeight*(.18+k*.15)+Math.sin(Date.now()/900+k)*18,g=x.createLinearGradient(0,y,innerWidth,y);g.addColorStop(0,'transparent');g.addColorStop(.5,l?'rgba(0,141,127,.12)':'rgba(67,239,208,.18)');g.addColorStop(1,'transparent');x.strokeStyle=g;x.beginPath();for(let a=0;a<innerWidth;a+=18){let yy=y+Math.sin(a*.018+Date.now()/700+k)*5;if(a===0)x.moveTo(a,yy);else x.lineTo(a,yy)}x.stroke()}requestAnimationFrame(d)}addEventListener('resize',r);r();d()})();
</script>
