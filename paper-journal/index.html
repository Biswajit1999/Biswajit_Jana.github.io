(10,20,38,.72);color:var(--text);font:inherit;outline:none}.hero-photo{margin:26px auto 0;min-height:330px;max-width:1100px;border:1px solid var(--border);border-radius:34px;overflow:hidden;background:linear-gradient(135deg,rgba(74,240,209,.18),rgba(143,179,255,.12),rgba(255,208,114,.07)),url('assets/images/journal-hero.jpg') center/cover;box-shadow:var(--shadow);position:relative}.hero-photo:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 35% 35%,transparent 0 22%,rgba(0,0,0,.36) 70%),linear-gradient(180deg,transparent,rgba(0,0,0,.58))}.featured-section{padding:16px 0 18px}.featured-card{display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden;border:1px solid var(--border);border-radius:30px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.featured-image{min-height:390px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(74,240,209,.24),rgba(143,179,255,.14),rgba(255,208,114,.10))}.featured-image img{height:100%;object-fit:cover}.featured-image:after,.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 44%,rgba(5,10,20,.70))}.featured-body{padding:clamp(26px,4vw,48px);display:flex;flex-direction:column;justify-content:center}.featured-label{color:var(--gold);font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;font-weight:800;margin-bottom:12px}.featured-body h2{font-family:var(--display);font-size:clamp(2rem,4vw,3.6rem);line-height:1.02;letter-spacing:-.045em;margin-bottom:14px}.featured-body p{color:var(--muted);font-size:1.02rem;margin-bottom:16px}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.pillrow span{border:1px solid var(--border);border-radius:999px;padding:6px 9px;color:var(--dim);font:700 .68rem var(--mono);background:rgba(255,255,255,.035)}.button{display:inline-flex;width:fit-content;color:#001715;background:linear-gradient(135deg,var(--accent),#dffff7);border-radius:999px;padding:11px 15px;font:900 .76rem var(--mono)}.posts-section{padding:20px 0 78px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.section-head h2{font-family:var(--display);font-size:clamp(2rem,3vw,3rem);letter-spacing:-.04em}.section-head p{color:var(--muted);max-width:560px;font-size:.96rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);transition:.25s;display:flex;flex-direction:column;min-height:100%;backdrop-filter:blur(16px)}.card:hover{transform:translateY(-6px);border-color:rgba(74,240,209,.32)}.thumb{height:185px;background:linear-gradient(135deg,rgba(74,240,209,.15),rgba(143,179,255,.10),rgba(255,208,114,.08));overflow:hidden;position:relative}.thumb img{height:100%;object-fit:cover}.card-body{padding:20px;display:flex;flex-direction:column;flex:1}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--accent);font:850 .69rem var(--mono);margin-bottom:10px}.card h2{font-size:1.20rem;line-height:1.24;margin-bottom:9px;letter-spacing:-.015em}.card p{color:var(--muted);font-size:.92rem;margin-bottom:14px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:8px}.tag{padding:5px 9px;border-radius:999px;background:rgba(74,240,209,.08);border:1px solid rgba(74,240,209,.19);color:var(--accent);font-size:.70rem;font-weight:850}.read-link{margin-top:16px;display:inline-flex;color:var(--accent);font-weight:900;font-size:.85rem}.article-hero{padding:70px 0 28px}.back-link{color:var(--accent);font:900 .75rem var(--mono);text-transform:uppercase;letter-spacing:.12em}.paper-top{display:grid;grid-template-columns:1fr .8fr;gap:24px;align-items:stretch;margin-top:22px}.paper-copy,.paper-side,.article-card{background:var(--card);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}.paper-copy{padding:clamp(26px,4vw,46px)}.paper-copy h1{font-size:clamp(2.4rem,5vw,4.4rem)}.paper-subtitle{font-size:1.16rem;color:var(--muted);max-width:760px}.paper-hero-image{min-height:380px;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,rgba(74,240,209,.2),rgba(143,179,255,.14),rgba(255,208,114,.08));position:relative}.paper-hero-image img{height:100%;object-fit:cover}.paper-hero-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.45))}.article-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;padding:20px 0 72px}.paper-side{padding:20px;position:sticky;top:88px}.mini-row{border-bottom:1px solid var(--border);padding:0 0 10px;margin-bottom:10px;color:var(--muted);font-size:.9rem}.mini-row strong{display:block;color:var(--text);font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;font-family:var(--mono);margin-bottom:3px}.article-stack{display:grid;gap:20px}.article-card{padding:clamp(22px,3vw,34px)}.article-card h2{font-family:var(--display);font-size:clamp(1.8rem,3vw,2.55rem);letter-spacing:-.04em;margin-bottom:14px}.article-card p{color:var(--muted);margin-bottom:14px}.article-card ul{color:var(--muted);padding-left:20px}.article-card li{margin:8px 0}.plot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.plot-card{border:1px dashed rgba(74,240,209,.28);border-radius:18px;padding:16px;background:rgba(74,240,209,.04)}.plot-placeholder{height:140px;border-radius:14px;background:linear-gradient(135deg,rgba(74,240,209,.10),rgba(143,179,255,.08));display:grid;place-items:center;color:var(--accent);font:900 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.prompt-box{font-size:.85rem;color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.035);border-radius:16px;padding:14px;margin-top:10px}.empty{color:var(--muted);text-align:center;padding:40px;border:1px solid var(--border);border-radius:20px;background:var(--card)}footer{padding:30px 0 44px;text-align:center;color:var(--dim);border-top:1px solid var(--border);font-size:.88rem}@media(max-width:980px){.featured-card,.grid,.paper-top,.article-layout{grid-template-columns:1fr}.paper-side{position:static}.plot-grid{grid-template-columns:1fr}}@media(max-width:680px){.toolbar{grid-template-columns:1fr}.thumb{height:210px}.section-head{display:block}.hero{padding-top:50px}}

<script>
const PAPERS=[
{slug:'zhao-2026-expres-hidden-systematics',title:'Uncovering Hidden Systematics in Extreme-Precision Radial Velocity Measurements',authors:'Lily L. Zhao, Debra A. Fischer, Andrew E. Szymkowiak, John M. Brewer, Joe Llama',short:'Zhao et al.',year:'2026',theme:'ePRV Systematics',venue:'ApJS · arXiv:2601.02296',read:'10 min read',source:'https://arxiv.org/abs/2601.02296',featured:true,subtitle:'EXPRES shows why long-baseline instrument telemetry is not optional.',summary:'EXPRES already has a laser frequency comb and excellent environmental control, yet seven years of data still contained a coherent 2.8 m/s instrumental trend. This note focuses on the paper as a template for state-vector thinking in precision spectrographs.',core:['This is the paper I would show someone who thinks a stable spectrograph is finished once the wavelength solution looks good. The authors use multi-target stacking, solar comparison with NEID, LFC line-bisector spans, 2D echellogram tracking and temperature telemetry to identify and correct a hidden systematic.','The correction reduces the solar trend from 1.32 m/s RMS to 0.43 m/s. The lesson is not only statistical; it is architectural. Calibration becomes a state-estimation problem, not a one-dimensional polynomial exercise.'],questions:['Would PCA or latent-state modelling show that several tracers are responses to the same underlying thermal mode?','Does LBS vary enough across order and wavelength that a single 5840 Å region under-corrects field-dependent IP changes?','How much of the remaining signal could come from CCD charge-transfer or long-term detector changes?'],connection:'For EXOhSPEC this argues for monitoring cross-dispersion echellogram geometry and environmental telemetry from the start, rather than relying only on a 1D wavelength solution.',plots:['EXPRES/NEID RV trend comparison','Multi-diagnostic time series: temperature, LBS, x/y shifts','Correction cascade RMS before and after','Injection-recovery grid','rho CrB periodogram'],prompt:'Scientific cinematic image inside a vacuum-enclosed echelle spectrograph with thermal heat-map contours, laser frequency comb lines, and a glowing detector echellogram; deep navy, teal and amber; no text.'},
{slug:'pepe-2021-espresso-performance',title:'ESPRESSO@VLT: On-Sky Performance and First Results',authors:'F. Pepe et al.',short:'Pepe et al.',year:'2021',theme:'Spectrograph Design',venue:'A&A 645, A96 · arXiv:2010.00316',read:'9 min read',source:'https://arxiv.org/abs/2010.00316',subtitle:'ESPRESSO as an engineering baseline for EPRV spectrograph design.',summary:'This note reads ESPRESSO as the benchmark architecture for modern optical EPRV work: nested thermal control, vacuum stability, fibre scrambling, calibration delivery and operational discipline.',core:['I read this paper as the engineering baseline for modern optical extreme-precision radial velocity work, not as a normal instrument-description paper.','The key lesson is that ESPRESSO’s precision is not produced by one heroic subsystem. It is a hierarchy of thermal, mechanical, optical and calibration decisions working together.'],questions:['What is the thermal transfer function of the multi-shell enclosure?','How repeatable is the calibration injection geometry after repeated switching?','How should FP+ThAr calibration be re-evaluated after later evidence for FP chromatic drift?'],connection:'For EXOhSPEC the lesson is not to copy ESPRESSO, but to quantify the transfer function of each stability layer and state clearly what residual drift reaches the optics.',plots:['Thermal-shell attenuation hierarchy','ESPRESSO observing modes table','Throughput and wavelength coverage panel'],prompt:'Cinematic image of the ESPRESSO spectrograph vacuum vessel in a dark observatory laboratory, nested thermal enclosure panels, teal and steel-blue lighting, fibre-feed lines, no text.'},
{slug:'schmidt-2026-eom-comb-espresso',title:'Test of a 34 GHz EOM Laser Frequency Comb at ESPRESSO',authors:'Tobias M. Schmidt et al.',short:'Schmidt et al.',year:'2026',theme:'Laser Frequency Comb',venue:'arXiv:2603.17908',read:'8 min read',source:'https://arxiv.org/abs/2603.17908',subtitle:'A comb test that also diagnoses calibration-injection systematics.',summary:'The EOM comb is technically impressive, but the most important lesson is the 15 m/s local discrepancy it exposes from calibration-unit light-injection differences.',core:['This is not just a paper about a new comb source. It is a field test of what happens when a metrology-grade calibrator meets a real observatory instrument.','A comb can be tied to the SI second, but the spectrograph measures the comb after the calibration unit, fibre feed, scrambling system, spectrograph optics and detector sampling have shaped the illumination.'],questions:['Over what exact exposure grouping and timescale is the 17 cm/s scatter measured?','Is the 15 m/s calibration-unit systematic static and mappable, or does it drift with mechanical and thermal changes?','Could live pupil or near-field monitoring catch this failure mode before it reaches the RV pipeline?'],connection:'For EXOhSPEC this sharpens the question of whether a calibration source traces the same optical path and illumination state as the science beam.',plots:['EOM comb architecture','Background fraction versus wavelength','Calibration-source mismatch/echellogram map'],prompt:'Photorealistic optical table with a thin-film lithium niobate waveguide chip emitting visible harmonic light and holographic comb lines; ESPRESSO-like spectrograph silhouette; no text.'},
{slug:'kreider-2025-fabry-perot-chromatic-drift',title:'Quantifying Broadband Chromatic Drifts in Fabry-Perot Resonators for Exoplanet Science',authors:'Molly Kate Kreider, Connor Fredrick, Scott A. Diddams et al.',short:'Kreider et al.',year:'2025',theme:'Calibration',venue:'Nature Astronomy · arXiv:2210.10988',read:'9 min read',source:'https://arxiv.org/abs/2210.10988',subtitle:'Why Fabry-Perot etalons are not simple achromatic rulers.',summary:'The paper shows that white-light Fabry-Perot etalons can drift chromatically at the precision level relevant to exoplanet searches.',core:['This paper changed how I think about Fabry-Perot etalons. I had treated them as dense, convenient drift monitors whose modes could be approximated as moving together.','The important result is that the drift is not a single global shift. Mirror-coating phase and material relaxation become part of the calibration error budget.'],questions:['Is the six-month drift linear only over that window, or does it follow a longer stress-relaxation law?','Do different vendors and coating stacks show the same chromatic pattern?','Can periodic LFC anchoring make FP-only calibration safe between comb exposures?'],connection:'For EXOhSPEC this paper is a warning that a passive calibrator is not physically simple just because it is operationally simpler than an LFC.',plots:['Chromatic drift across wavelength','FP resonance condition with mirror phase','Long-term LFC-anchored FP drift monitoring'],prompt:'Close-up photorealistic Fabry-Perot etalon in a vacuum chamber, rainbow mirror coatings, evenly spaced spectral lines drifting subtly from blue to amber; no text.'},
{slug:'sercel-2024-thermal-control-delay-lines',title:'Thermal Control of Long Delay Lines in a High-Resolution Astrophotonic Spectrograph',authors:'Gregory P. Sercel, Pradip R. Gatkine, Nemanja Jovanovic et al.',short:'Sercel et al.',year:'2024',theme:'Thermal Control',venue:'SPIE · arXiv:2403.10019',read:'7 min read',source:'https://arxiv.org/abs/2403.10019',subtitle:'A compact thermal-control paper with a clear tolerance chain.',summary:'This note focuses on the clean chain from resolving power to delay length, thermo-optic sensitivity, allowed phase error and controller requirement.',core:['The paper is not directly about EXOhSPEC, but the logic is clean: resolution requirement to delay-line length to optical-path sensitivity to thermal stability specification.','The experimental system is intentionally practical: SiN photonic FTS chip, brass plate, Peltier cooler, thermistor feedback, Arduino PID and optical fringe validation.'],questions:['What is the phase-noise PSD in the 1–60 s band relevant to exposure times?','How large are intra-chip thermal gradients when different phase shifters are active?','Would feed-forward correction during known switching events reduce settling time?'],connection:'For my own work, this is a model for explaining EXOhSPEC tolerance chains without vague language like “we stabilise temperature”.',plots:['Tolerance chain from resolution to temperature stability','PID thermal settling curve','Fringe phase-error measurement'],prompt:'Macro photorealistic silicon nitride photonic chip on a thermoelectric cooler with glowing waveguide spirals and a stable interference fringe; no text.'},
{slug:'khandelwal-2024-scmos-detectors',title:'Beyond CCDs: Characterization of sCMOS Detectors for Optical Astronomy',authors:'Aditya Khandelwal, Sarik Jeram, Ryan Dungee et al.',short:'Khandelwal et al.',year:'2024',theme:'Detectors',venue:'SPIE · arXiv:2409.16449',read:'8 min read',source:'https://arxiv.org/abs/2409.16449',subtitle:'A careful imaging detector paper, but not yet an EPRV detector proof.',summary:'The paper shows modern sCMOS performance is impressive, especially the Orca-Quest, but precision spectroscopy needs additional centroid-stability and detector-systematics tests.',core:['I read this with a spectroscopy question: not only whether sCMOS can replace CCDs in imaging, but what extra tests are needed before trusting them in precision spectrographs.','Photon-transfer performance is necessary, not sufficient. An RV spectrograph cares about whether detector behaviour shifts the measured centroids of narrow spectral lines.'],questions:['What is the low-light non-linearity below about 100 electrons?','How much fixed-pattern-noise residual remains after flat-fielding?','What are the inter-pixel capacitance and cross-talk kernels?','How stable are gain, read noise and hot-pixel population over years?'],connection:'For EXOhSPEC-style spectroscopy, this paper is a starting point for detector selection, not a final proof of RV suitability.',plots:['Detector comparison table','Photon transfer curve schematic','Centroid stability versus signal level test plan'],prompt:'Macro photorealistic sCMOS detector array on a gold PCB inside a cooled camera housing, pixel grid catching teal-blue light, oscilloscope glow; no text.'},
{slug:'luhman-2025-ic348-h-class-brown-dwarfs',title:'A New Spectral Class of Brown Dwarfs at the Bottom of the IMF in IC 348',authors:'K. L. Luhman and C. Alves de Oliveira',short:'Luhman & Alves de Oliveira',year:'2025',theme:'Brown Dwarfs',venue:'ApJ Letters · arXiv:2506.08969',read:'8 min read',source:'https://arxiv.org/abs/2506.08969',subtitle:'A JWST discovery note that should stay cautious about the proposed H class.',summary:'JWST/NIRSpec reveals a broad 3.4 micron absorption feature in very low-mass IC 348 objects, but the molecular carrier and classification status need careful framing.',core:['The exciting part is not only the proposed “H” spectral class. It is the fact that JWST is exposing an opacity source around 3.4 microns that current brown-dwarf atmospheric models do not predict.','The data justify naming a repeatable spectral morphology. The physics does not yet identify the carrier, condensation state or formation pathway.'],questions:['Which gas-phase or condensed aliphatic species reproduce the band shape at relevant temperature and pressure?','Do field late-T/Y dwarfs show the feature, or is it young/low-gravity/environment-specific?','Can disk emission or extinction be ruled out object-by-object?'],connection:'This connects to my brown dwarf work by showing how JWST can reveal missing opacity sources that then reshape classification and model fitting.',plots:['NIRSpec 3.4 micron feature','Absorption strength versus J magnitude','Atmosphere versus disk/extinction decision tree'],prompt:'Photorealistic ultra-low-mass brown dwarf in the IC 348 young star cluster, amber atmosphere, teal nebular dust, subtle infrared spectral arc at 3.4 microns; no text.'},
{slug:'chen-2025-cosmos-web-brown-dwarf-density',title:'Brown Dwarf Number Density in the JWST COSMOS-Web Field',authors:'Amos Y.-A. Chen, Tomotsugu Goto et al.',short:'Chen et al.',year:'2025',theme:'Brown Dwarfs',venue:'PASA · arXiv:2503.18510',read:'8 min read',source:'https://arxiv.org/abs/2503.18510',subtitle:'A photometric census paper that needs explicit confirmation and completeness boundaries.',summary:'COSMOS-Web NIRCam photometry turns late-T/Y dwarf selection into a kpc-scale Galactic-structure problem, but spectroscopy and completeness remain the key limitations.',core:['The clever part is the colour selection. F115W samples a J-band peak, F277W sits inside a strong absorption trough, and F444W samples the redward rise.','The colour cuts are effectively a three-point curvature test of the SED. That is elegant, but it inherits all catalogue-level systematics: depth variation, point-source classification, model scatter and contamination.'],questions:['How many of the 27 candidates survive NIRSpec confirmation?','What is the completeness and contamination curve versus magnitude?','How large is inter-model scatter between Sonora-Bobcat, ATMO2020++ and LOWZ?','How do unresolved binaries bias distances and number densities?'],connection:'This is not instrumentation work, but it teaches how a clever measurement proxy can encode physical opacity into a scalable survey selector.',plots:['Colour-colour selection diagram','Representative SED fits','Number density versus temperature bins','Cumulative count versus F444W magnitude'],prompt:'Deep-space illustration of a faint brown dwarf in the distant Milky Way disk with a ghostly V-shaped near-infrared spectral curve in teal; no text.'}
];
const themeSwitch=document.getElementById('themeSwitch');if(localStorage.getItem('theme')==='light'){document.body.classList.add('light');themeSwitch.checked=true}themeSwitch.addEventListener('change',()=>{document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function img(src,alt){return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.style.display='none'">`}function linkFor(p){return `papers/${p.slug}/`}
function home(){document.title='Research Reading Journal | Biswajit Jana';let f=PAPERS.find(p=>p.featured)||PAPERS[0];document.getElementById('app').innerHTML=`<section class="hero"><div class="container"><div class="kicker">Research Reading Journal</div><h1>Reading papers actively, not passively.</h1><p class="lead">A curated archive of close-reading notes on astrophysical instrumentation, extreme-precision radial velocity, brown dwarfs, detectors, calibration systems and observational methods. Each entry asks: what does the paper prove, what do I infer, and what remains open?</p><div class="toolbar"><input id="searchInput" type="search" placeholder="Search papers, authors, topics..."/><select id="filter"><option value="all">All themes</option>${[...new Set(PAPERS.map(p=>p.theme))].sort().map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="hero-photo"></div></div></section><section class="featured-section"><div class="container"><article class="featured-card"><a class="featured-image" href="${linkFor(f)}">${img(`papers/${f.slug}/images/card.jpg`,f.title)}</a><div class="featured-body"><div class="featured-label">Featured reading note</div><h2>${esc(f.title)}</h2><p>${esc(f.summary)}</p><div class="pillrow"><span>${esc(f.theme)}</span><span>${esc(f.short)} ${esc(f.year)}</span><span>${esc(f.read)}</span></div><a class="button" href="${linkFor(f)}">Read note →</a></div></article></div></section><section class="posts-section"><div class="container"><div class="section-head"><div><div class="kicker">All notes</div><h2>Paper archive</h2></div><p>No public scorecards or leverage numbers here: this page is designed for academic reading, not internal ranking.</p></div><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">No papers match your search.</div></div></section>`;const q=document.getElementById('searchInput'),filt=document.getElementById('filter');function render(){let query=q.value.toLowerCase(),cat=filt.value;let items=PAPERS.filter(p=>(cat==='all'||p.theme===cat)&&[p.title,p.authors,p.theme,p.summary,p.subtitle].join(' ').toLowerCase().includes(query));document.getElementById('empty').style.display=items.length?'none':'block';document.getElementById('grid').innerHTML=items.map(p=>`<article class="card"><a class="thumb" href="${linkFor(p)}">${img(`papers/${p.slug}/images/card.jpg`,p.title)}</a><div class="card-body"><div class="meta"><span>${esc(p.theme)}</span><span>${esc(p.read)}</span></div><h2>${esc(p.title)}</h2><p>${esc(p.subtitle)}</p><div class="tags"><span class="tag">${esc(p.short)} ${esc(p.year)}</span><span class="tag">Paper note</span></div><a class="read-link" href="${linkFor(p)}">Read note →</a></div></article>`).join('')}q.addEventListener('input',render);filt.addEventListener('change',render);render()}
function article(p){document.title=p.title+' | Research Reading Journal';document.getElementById('app').innerHTML=`<header class="article-hero container"><a class="back-link" href="./">← Back to journal</a><div class="paper-top"><div class="paper-copy"><div class="pillrow"><span>${esc(p.theme)}</span><span>${esc(p.short)} ${esc(p.year)}</span><span>${esc(p.read)}</span></div><h1>${esc(p.title)}</h1><p class="paper-subtitle">${esc(p.subtitle)}</p></div><div class="paper-hero-image">${img(`papers/${p.slug}/images/hero.jpg`,p.title)}</div></div></header><main class="container article-layout"><aside class="paper-side"><h3>Paper details</h3><div class="mini-row"><strong>Authors</strong>${esc(p.authors)}</div><div class="mini-row"><strong>Venue</strong>${esc(p.venue)}</div><div class="mini-row"><strong>Theme</strong>${esc(p.theme)}</div><div class="mini-row"><strong>Source</strong><a style="color:var(--accent)" href="${esc(p.source)}" target="_blank" rel="noopener">Original paper</a></div></aside><div class="article-stack"><section class="article-card"><h2>Core idea</h2>${p.core.map(x=>`<p>${esc(x)}</p>`).join('')}</section><section class="article-card"><h2>Questions this paper leaves me with</h2><ul>${p.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="article-card"><h2>Connection to my research direction</h2><p>${esc(p.connection)}</p></section><section class="article-card"><h2>Figures and plots to add</h2><p>These slots are ready for the next phase when we add recreated plots, permitted source figures, or your own diagrams.</p><div class="plot-grid">${p.plots.map((x,i)=>`<div class="plot-card"><div class="plot-placeholder">Plot ${i+1}</div><p>${esc(x)}</p></div>`).join('')}</div></section><section class="article-card"><h2>Image prompt for card/hero artwork</h2><p>Use this as the starting prompt for generating a clean card image and wider hero image.</p><div class="prompt-box">${esc(p.prompt)}</div></section></div></main>`}
let params=new URLSearchParams(location.search);let slug=params.get('paper')||location.pathname.split('/').filter(Boolean).pop();let p=PAPERS.find(x=>x.slug===slug);p?article(p):home();
</script></body></html>
