t(135deg,rgba(74,240,209,.14),rgba(143,179,255,.11),rgba(198,168,255,.08))}.missing-art span{font:900 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.featured-body{padding:clamp(28px,4vw,50px);display:flex;flex-direction:column;justify-content:center}.featured-label{color:var(--gold);font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;font-weight:900;margin-bottom:12px}.featured-body h2{font-family:var(--display);font-size:clamp(2rem,4vw,3.55rem);line-height:1.02;letter-spacing:-.045em;margin-bottom:14px}.featured-body p{color:var(--muted);font-size:1.02rem;margin-bottom:16px}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.pillrow span{border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:var(--dim);font:800 .68rem var(--mono);background:rgba(255,255,255,.035)}.button{display:inline-flex;width:fit-content;color:#001715;background:linear-gradient(135deg,var(--accent),#dffff7);border-radius:999px;padding:12px 16px;font:900 .76rem var(--mono)}.posts-section{padding:26px 0 80px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.section-head h2{font-family:var(--display);font-size:clamp(2rem,3vw,3rem);letter-spacing:-.04em}.section-head p{color:var(--muted);max-width:580px;font-size:.97rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);transition:.25s;display:flex;flex-direction:column;min-height:100%;backdrop-filter:blur(16px)}.card:hover{transform:translateY(-6px);border-color:rgba(74,240,209,.34)}.thumb{height:190px;background:linear-gradient(135deg,rgba(74,240,209,.14),rgba(143,179,255,.10),rgba(255,208,114,.07));overflow:hidden;position:relative}.thumb img{height:100%;object-fit:cover}.card-body{padding:20px;display:flex;flex-direction:column;flex:1}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--accent);font:850 .69rem var(--mono);margin-bottom:10px}.card h2{font-size:1.16rem;line-height:1.26;margin-bottom:10px;letter-spacing:-.015em}.card p{color:var(--muted);font-size:.93rem;margin-bottom:14px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:8px}.tag{padding:5px 9px;border-radius:999px;background:rgba(74,240,209,.08);border:1px solid rgba(74,240,209,.19);color:var(--accent);font-size:.70rem;font-weight:850}.read-link{margin-top:16px;display:inline-flex;color:var(--accent);font-weight:900;font-size:.85rem}.article-hero{padding:68px 0 28px}.back-link{color:var(--accent);font:900 .75rem var(--mono);text-transform:uppercase;letter-spacing:.12em}.paper-top{display:grid;grid-template-columns:1.05fr .85fr;gap:24px;align-items:stretch;margin-top:22px}.paper-copy,.paper-side,.article-card{background:var(--card);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}.paper-copy{padding:clamp(28px,4vw,50px)}.paper-copy h1{font-size:clamp(2.45rem,5vw,4.55rem)}.paper-subtitle{font-size:1.16rem;color:var(--muted);max-width:760px}.paper-hero-image{min-height:410px;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,rgba(74,240,209,.16),rgba(143,179,255,.13),rgba(255,208,114,.08));position:relative}.paper-hero-image img{height:100%;object-fit:cover}.article-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;padding:20px 0 76px}.paper-side{padding:20px;position:sticky;top:82px}.paper-side h3{font-size:1.04rem;margin-bottom:12px}.mini-row{border-bottom:1px solid var(--border);padding:0 0 11px;margin-bottom:11px;color:var(--muted);font-size:.9rem;word-break:break-word}.mini-row strong{display:block;color:var(--text);font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;font-family:var(--mono);margin-bottom:4px}.article-stack{display:grid;gap:20px}.article-card{padding:clamp(24px,3vw,36px)}.article-card h2{font-family:var(--display);font-size:clamp(1.85rem,3vw,2.6rem);letter-spacing:-.04em;margin-bottom:14px}.article-card p{color:var(--muted);margin-bottom:15px;font-size:1.01rem}.article-card ul{color:var(--muted);padding-left:20px}.article-card li{margin:9px 0}.article-card strong{color:var(--text)}.quote{border-left:3px solid var(--accent);padding:12px 0 12px 18px;color:var(--text);font-style:italic;margin:16px 0;background:linear-gradient(90deg,rgba(74,240,209,.06),transparent);border-radius:0 14px 14px 0}.plot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.plot-card{border:1px dashed rgba(74,240,209,.28);border-radius:18px;padding:16px;background:rgba(74,240,209,.04)}.plot-placeholder{height:140px;border-radius:14px;background:linear-gradient(135deg,rgba(74,240,209,.12),rgba(143,179,255,.08));display:grid;place-items:center;color:var(--accent);font:900 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.prompt-box{font-size:.88rem;color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.04);border-radius:16px;padding:15px;margin-top:10px}.empty{color:var(--muted);text-align:center;padding:40px;border:1px solid var(--border);border-radius:20px;background:var(--card)}footer{padding:30px 0 44px;text-align:center;color:var(--dim);border-top:1px solid var(--border);font-size:.88rem}@media(max-width:980px){.featured-card,.grid,.paper-top,.article-layout{grid-template-columns:1fr}.paper-side{position:static}.plot-grid{grid-template-columns:1fr}}@media(max-width:680px){.nav-inner{height:auto;padding:13px 0}.toolbar{grid-template-columns:1fr}.hero{padding-top:46px}.thumb{height:210px}.section-head{display:block}.paper-copy,.article-card{padding:22px}}

<script>
const PAPERS=[
{slug:'zhao-2026-expres-hidden-systematics',title:'Uncovering Hidden Systematics in Extreme-Precision Radial Velocity Measurements',authors:'Lily L. Zhao, Debra A. Fischer, Andrew E. Szymkowiak, John M. Brewer, Joe Llama',short:'Zhao et al.',year:'2026',theme:'ePRV Systematics',venue:'ApJS · arXiv:2601.02296',read:'14 min read',source:'https://arxiv.org/abs/2601.02296',featured:true,subtitle:'EXPRES shows why long-baseline instrument telemetry is not optional.',summary:'A hidden 2.8 m/s EXPRES instrumental trend, invisible to the standard pipeline, is recovered through multi-star stacking, solar comparison, comb-line diagnostics and two-dimensional echellogram tracking.',why:['I chose this paper because it is almost exactly the kind of diagnostic analysis I expect to need for EXOhSPEC: environmental telemetry, calibration frames, detector geometry and astrophysical measurements all treated as one coupled system.','It is useful for a PhD-facing portfolio because it shows that precision spectroscopy is not only about building a stable instrument. It is also about proving, years later, that the instrument did not write a false planet into the data.'],core:['EXPRES is a stabilised fibre-fed echelle spectrograph with laser-frequency-comb calibration and strong environmental control. Yet seven years of data contained a coherent instrumental drift with trough-to-peak amplitude around 2.8 m/s. That scale is large enough to mimic or suppress low-mass planets.','The authors uncover the trend by stacking radial velocities from quiet survey stars and by differencing EXPRES solar data against NEID solar observations. This separates common solar variability from instrument-specific structure.','The paper then builds an instrumental state vector from temperature sensors, LFC line-bisector span and two-dimensional echellogram motion. The important conceptual shift is that the wavelength solution is not enough: cross-dispersion motion and IP asymmetry contain diagnostic information the standard 1D pipeline does not fully use.'],technical:['The most useful diagnostic is the move from a scalar RV residual to a multi-dimensional instrument-state model. The design matrix contains normalised tracers such as temperatures, echellogram x/y motion, skew/scale terms and comb-line asymmetry.','The correction reduces the solar RV trend from 1.32 m/s RMS to 0.43 m/s. That is not just a better fit; it changes the detectability of injected planets and removes a suspicious signal in rho CrB residuals.','The strongest limitation is that several tracers may be correlated responses to the same thermal disturbance. A PCA or latent-state representation could reveal whether the regression is fitting independent physics or multiple projections of the same mode.'],questions:['Would a PCA/latent-state model show that the temperature, LBS and echellogram terms are not independent tracers but coupled responses to one thermal mode?','Does the LFC line-bisector span measured near one wavelength represent the full detector, or does IP asymmetry vary order-by-order?','How much of the remaining long-baseline structure could come from CCD charge-transfer changes or other detector ageing effects?','Can the same diagnostic framework be applied earlier in an instrument lifetime rather than after several years of data have accumulated?'],connection:'For EXOhSPEC, this paper argues for monitoring cross-dispersion echellogram geometry and environmental telemetry from the start. It also gives me a language for describing my own work: a spectrograph is a state-vector system, not merely a wavelength-calibrated box.',take:'This is one of the strongest cold-email leverage papers because the gap is clear and technically mature: how do we design instruments and pipelines so that hidden systematics are discovered before they become planet candidates?',plots:['EXPRES and NEID solar RV trend comparison','Multi-diagnostic time series: temperature, LBS, x/y echellogram motion','Correction cascade showing RMS before and after each tracer family','Injection-recovery grid before and after correction','rho CrB periodogram before and after systematic correction'],prompt:'Scientific cinematic image inside a vacuum-enclosed echelle spectrograph with thermal heat-map contours, laser frequency comb lines, and a glowing detector echellogram; deep navy, teal and amber; no text.'},
{slug:'pepe-2021-espresso-performance',title:'ESPRESSO@VLT: On-Sky Performance and First Results',authors:'F. Pepe et al.',short:'Pepe et al.',year:'2021',theme:'Spectrograph Design',venue:'A&A 645, A96 · arXiv:2010.00316',read:'13 min read',source:'https://arxiv.org/abs/2010.00316',subtitle:'ESPRESSO as an engineering baseline for EPRV spectrograph design.',summary:'ESPRESSO is treated here as a reference architecture for precision radial-velocity instrumentation: vacuum vessel, thermal shells, fibre scrambling, calibration delivery and operational lessons.',why:['I selected this paper because any serious discussion of high-resolution optical radial-velocity spectrographs eventually has to benchmark itself against ESPRESSO.','It is not a paper to read for one headline number. It is a paper to read for the stability hierarchy: what has to be controlled, how tightly, and how failure appears when one subsystem underperforms.'],core:['ESPRESSO represents the mature HARPS-to-ESPRESSO design philosophy: fibre-fed, vacuum-stabilised, thermally nested and calibration-rich. Its 1-UT high-resolution mode reaches R around 140,000, while the 4-UT mode trades resolution for collecting area.','The paper is valuable because it reports both successes and shortcomings. The multi-shell thermal enclosure, fibre scrambling and vacuum stabilisation are design strengths; the fibre-link throughput issue and early LFC reliability problems are equally instructive.','The key lesson is that 10 cm/s-class instrumental stability is a hierarchy problem. Thermal, mechanical, optical, detector and calibration subsystems all contribute. No single subsystem can be allowed to become an unmonitored assumption.'],technical:['The multi-shell enclosure is best understood as multiplicative attenuation: each layer reduces external thermal variation before it reaches the optical bench. This is more practical than demanding one extreme controller to suppress kelvin-level room changes directly to the mK regime.','The vacuum vessel removes air refractive-index fluctuations, which is the dominant difference from smaller non-vacuum or partially enclosed systems. That matters directly to my EXOhSPEC thinking because EXOhSPEC is exploring active environmental control rather than full vacuum isolation.','The paper does not fully expose the frequency-domain transfer function of the thermal system. A single RMS stability number does not tell us whether thermal power appears on exposure timescales, nightly timescales or seasonal timescales.'],questions:['What is the measured thermal transfer function from the Coudé Laboratory to each shell and to the bench?','How repeatable is the calibration injection geometry after repeated switching between science and calibration paths?','How should the ThAr+Fabry-Perot operational strategy be re-evaluated in light of later Fabry-Perot chromatic drift results?','Does 4-UT mode introduce additional differential optical-path or illumination systematics compared with 1-UT mode?'],connection:'For EXOhSPEC the lesson is not to copy ESPRESSO blindly. The lesson is to state the stability chain explicitly: what environmental disturbance enters, what each layer attenuates, and what residual motion reaches the spectrum.',take:'This is a foundational reference for my instrumentation direction. It gives the engineering context around which smaller active-control spectrograph experiments can be positioned honestly.',plots:['Thermal-shell attenuation hierarchy','ESPRESSO observing modes and resolution comparison','Calibration architecture: ThAr, FP and LFC roles','Throughput and wavelength coverage summary'],prompt:'Cinematic image of the ESPRESSO spectrograph vacuum vessel in a dark observatory laboratory, nested thermal enclosure panels, teal and steel-blue lighting, fibre-feed lines, no text.'},
{slug:'schmidt-2026-eom-comb-espresso',title:'Test of a 34 GHz EOM Laser Frequency Comb at ESPRESSO',authors:'Tobias M. Schmidt et al.',short:'Schmidt et al.',year:'2026',theme:'Laser Frequency Comb',venue:'arXiv:2603.17908',read:'12 min read',source:'https://arxiv.org/abs/2603.17908',subtitle:'A comb test that also diagnoses calibration-injection systematics.',summary:'The EOM comb result is technically strong, but the most interesting lesson is the calibration-unit mismatch it reveals inside a real operational spectrograph.',why:['I selected this because it connects laser-frequency-comb metrology to the messy reality of a telescope-fed precision spectrograph.','For a cold email, this is useful because the gap is sharp: the source may be stable, but the calibration delivery path can still create large local systematics.'],core:['The paper tests a 34 GHz electro-optic-modulation laser frequency comb at ESPRESSO. A comb can be referenced to an absolute clock, but a spectrograph never measures the abstract comb. It measures the comb after coupling, propagation, scrambling, injection geometry, optics and detector sampling.','The reported short-term stability is impressive. The more instructive result is that comparison with the existing calibration unit reveals a local systematic at the many m/s level. That is far larger than the intrinsic comb precision.','The paper therefore demonstrates a field truth: metrology-grade calibration sources do not automatically produce metrology-grade wavelength solutions unless the illumination geometry is controlled and monitored.'],technical:['The strongest conceptual point is the distinction between source stability and delivered calibration stability. A frequency comb solves mode spacing and absolute reference, but not modal illumination, near/far-field mismatch, switching repeatability or calibration-source injection geometry.','This is exactly why calibration units require their own diagnostics. A comb line can be perfect in frequency and still produce a biased detector centroid if it enters the spectrograph differently from the science light.','The paper should be read together with ESPRESSO performance work and with Fabry-Perot chromatic drift papers, because all three show that calibration is a physical subsystem, not just a source choice.'],questions:['Is the local calibration-unit systematic static and therefore mappable, or does it vary with time, temperature or mechanical repeatability?','Could simultaneous near-field/far-field monitoring have detected the mismatch earlier?','What exposure grouping and timescale define the quoted stability, and how does that translate into nightly RV operation?','How does the EOM comb compare operationally with a laser-frequency comb and a Fabry-Perot etalon in maintenance burden and uptime?'],connection:'For EXOhSPEC this paper sharpens a key design question: does the calibration beam experience the same optical state as the science beam, or only the same nominal path? That difference matters at the sub-pixel level.',take:'The best cold-email angle is not “the comb is good”. It is: how should calibration delivery geometry be measured continuously so a high-grade calibrator does not hide a low-grade injection path?',plots:['EOM comb architecture and mode spacing','Comb signal and background fraction versus wavelength','Local calibration-unit systematic map','Science/calibration injection geometry schematic'],prompt:'Photorealistic optical table with a thin-film lithium niobate waveguide chip emitting visible harmonic light and holographic comb lines; ESPRESSO-like spectrograph silhouette; no text.'},
{slug:'kreider-2025-fabry-perot-chromatic-drift',title:'Quantifying Broadband Chromatic Drifts in Fabry-Perot Resonators for Exoplanet Science',authors:'Molly Kate Kreider, Connor Fredrick, Scott A. Diddams et al.',short:'Kreider et al.',year:'2025',theme:'Calibration',venue:'Nature Astronomy · arXiv:2210.10988',read:'13 min read',source:'https://arxiv.org/abs/2210.10988',subtitle:'Why Fabry-Perot etalons are not simple achromatic rulers.',summary:'White-light Fabry-Perot etalons are convenient dense calibration sources, but this paper shows their drift can be chromatic and physically linked to mirror-coating changes.',why:['I selected this paper because it changes the way I should talk about Fabry-Perot etalons. They are not simply passive forests of stable lines; their mirror coatings are part of the calibration physics.','The paper is highly relevant to supervisors working on EPRV calibration because it turns a practical calibration tool into a materials-stability problem.'],core:['Fabry-Perot etalons are widely used as drift monitors because they provide dense, narrow, evenly spaced lines across wide wavelength ranges. The operational assumption is often that cavity drift is approximately achromatic.','Kreider et al. show that this assumption fails at precision levels relevant to exoplanet science. Using laser-frequency-comb anchoring, they detect wavelength-dependent drift patterns in HPF and NEID etalons.','The physical interpretation is linked to dielectric mirror coatings. Small changes in coating thickness or refractive index perturb the wavelength-dependent reflective phase, shifting different modes by different amounts.'],technical:['The key equation is the Fabry-Perot resonance condition with a mirror phase term. The cavity length sets the basic free spectral range, but the reflective phase term is wavelength dependent.','If the physical cavity length changes uniformly, the drift is achromatic. If the mirror coating phase changes, the drift becomes chromatic. That is the conceptual heart of the paper.','The authors infer extremely small coating-layer changes from a large number of monitored modes. The result shows how astronomical calibration has reached a regime where thin-film materials physics becomes an RV systematic.'],questions:['Is the observed six-month trend truly linear, or is it a local approximation to a longer stress-relaxation curve?','Do different coating materials, vendors and deposition processes show the same drift morphology?','Can periodic LFC anchoring make FP-only calibration safe between comb exposures?','Can witness samples or ellipsometry validate the inferred layer changes independently?'],connection:'For EXOhSPEC this is a warning that a passive calibrator is not physically simple just because it is operationally simpler than a comb. Any long-term calibration source needs its own ageing model.',take:'The strongest research gap is long-term predictability. If coating relaxation is nonlinear over years, old FP-calibrated RV archives may carry structured wavelength-dependent errors that are hard to reconstruct without absolute references.',plots:['Chromatic drift pattern across wavelength','Fabry-Perot resonance condition with mirror phase','Coating-layer perturbation schematic','LFC-anchored monitoring strategy over years'],prompt:'Close-up photorealistic Fabry-Perot etalon in a vacuum chamber, rainbow mirror coatings, evenly spaced spectral lines drifting subtly from blue to amber; no text.'},
{slug:'sercel-2024-thermal-control-delay-lines',title:'Thermal Control of Long Delay Lines in a High-Resolution Astrophotonic Spectrograph',authors:'Gregory P. Sercel, Pradip R. Gatkine, Nemanja Jovanovic et al.',short:'Sercel et al.',year:'2024',theme:'Thermal Control',venue:'SPIE · arXiv:2403.10019',read:'11 min read',source:'https://arxiv.org/abs/2403.10019',subtitle:'A compact thermal-control paper with a clear tolerance chain.',summary:'A silicon-nitride astrophotonic Fourier-transform spectrograph needs long delay-line stability, making temperature control a direct optical-path-length requirement.',why:['I selected this because the logic is close to my EXOhSPEC work even though the platform is astrophotonic. The paper connects optical-path stability to a thermal controller in a clean and quantitative way.','It is useful for my own writing because it shows how to justify a temperature-control requirement from the optical measurement, rather than presenting PID control as an isolated engineering detail.'],core:['The paper studies thermal control of long delay lines in a high-resolution astrophotonic spectrograph. Silicon nitride waveguides are compact, but their optical path length is temperature sensitive through thermo-optic and expansion effects.','The system uses a thermoelectric cooler, temperature sensing and PID-style control to stabilise the chip so that interferometric phase remains usable. The value of the paper is the tolerance chain from desired spectral performance to allowable phase/OPL drift.','For me, the central lesson is that a thermal controller should be evaluated through the optical quantity it protects. Temperature stability is not the final metric; phase or optical path stability is.'],technical:['The strongest section is the translation from spectrograph resolution and delay length into thermal stability. This is exactly the type of reasoning needed in EXOhSPEC: connect a pixel or OPL tolerance to a controller requirement.','A single sensor may stabilise the mounting plate but not necessarily resolve intra-chip gradients. For long delay lines, spatial gradients can matter as much as mean chip temperature.','The paper would become stronger with frequency-domain phase-noise analysis. RMS temperature stability alone does not reveal whether noise is harmful on exposure timescales.'],questions:['What is the phase-noise power spectral density in the 1–60 second band relevant to exposures?','How large are intra-chip thermal gradients when different heaters or phase shifters are active?','Can feed-forward correction during known thermal switching events reduce settling time?','What is the long-term drift over days rather than short laboratory runs?'],connection:'For EXOhSPEC, this paper gives a clean template: start from the optical tolerance, derive the thermal tolerance, then evaluate the controller through measured OPL or pixel stability rather than temperature alone.',take:'This is a compact but valuable paper because it makes thermal control feel like optical metrology rather than electronics housekeeping.',plots:['Tolerance chain from resolving power to temperature stability','PID thermal settling curve','Fringe phase-error measurement','Sensor placement and gradient-risk schematic'],prompt:'Macro photorealistic silicon nitride photonic chip on a thermoelectric cooler with glowing waveguide spirals and a stable interference fringe; no text.'},
{slug:'khandelwal-2024-scmos-detectors',title:'Beyond CCDs: Characterization of sCMOS Detectors for Optical Astronomy',authors:'Aditya Khandelwal, Sarik Jeram, Ryan Dungee et al.',short:'Khandelwal et al.',year:'2024',theme:'Detectors',venue:'SPIE · arXiv:2409.16449',read:'12 min read',source:'https://arxiv.org/abs/2409.16449',subtitle:'A careful imaging detector paper, but not yet an EPRV detector proof.',summary:'Modern sCMOS detectors are becoming attractive as CCD supply declines, but precision spectroscopy needs additional tests beyond standard imaging characterisation.',why:['I selected this because detector choice is becoming a real instrument-design constraint, not just a performance preference. CCD supply is changing, and astronomy needs to know what sCMOS can and cannot replace.','I also wanted to read it as a spectroscopist: not only “is the image clean?”, but “does the detector preserve line centroids well enough for precision spectroscopy?”'],core:['The paper characterises several commercial sCMOS detectors using standard metrics such as conversion gain, read noise, dark current, linearity and quantum efficiency. The Orca-Quest result is particularly notable because of sub-electron read noise.','For imaging, these results are encouraging. For precision spectroscopy, they are necessary but incomplete. An RV spectrograph cares about whether detector behaviour moves the apparent centroid of a spectral line.','The paper therefore opens the door to sCMOS astronomy, but it does not close the detector-systematics question for high-stability spectrographs.'],technical:['The photon-transfer-curve analysis is useful because it links ADU to electrons and separates read-noise behaviour from photon noise. But PTCs do not directly test intra-pixel response, inter-pixel capacitance or spectroscopic centroid stability.','CMOS detectors do not have CCD-style charge transfer in the same way, but they have their own analogous systematics: per-pixel amplifier variation, fixed-pattern noise, cross-talk, rolling/global shutter effects and inter-pixel capacitance.','For EPRV work, the decisive experiment would be to put the detector behind a stable line source or etalon and measure centroid stability as a function of signal level, temperature and illumination pattern.'],questions:['What is the low-light non-linearity below about 100 electrons?','How much fixed-pattern-noise residual remains after flat-fielding in spectroscopic extraction?','What are the inter-pixel capacitance and cross-talk kernels for the best-performing devices?','How stable are gain, read noise and hot-pixel populations over multi-year operation?'],connection:'For EXOhSPEC-style spectroscopy, this paper is a starting point for detector selection. It helps identify promising devices but also clarifies what extra tests are needed before claiming RV suitability.',take:'The strongest improvement would be an RV-specific detector benchmark: stable emission/comb lines, repeated centroiding and a detector-induced velocity error budget.',plots:['Detector comparison table','Photon transfer curve schematic','Low-light non-linearity test plan','Spectral-line centroid stability experiment'],prompt:'Macro photorealistic sCMOS detector array on a gold PCB inside a cooled camera housing, pixel grid catching teal-blue light, oscilloscope glow; no text.'},
{slug:'luhman-2025-ic348-h-class-brown-dwarfs',title:'A New Spectral Class of Brown Dwarfs at the Bottom of the IMF in IC 348',authors:'K. L. Luhman and C. Alves de Oliveira',short:'Luhman & Alves de Oliveira',year:'2025',theme:'Brown Dwarfs',venue:'ApJ Letters · arXiv:2506.08969',read:'12 min read',source:'https://arxiv.org/abs/2506.08969',subtitle:'A JWST discovery note that should stay cautious about the proposed H class.',summary:'JWST/NIRSpec reveals a broad 3.4 micron feature in very low-mass IC 348 objects, raising classification and opacity questions for young brown dwarfs.',why:['I selected this because it is close to my brown-dwarf survey interests but also shows the danger of classification outrunning physical interpretation.','The paper is exciting, but the best reading is a cautious one: the spectral morphology is real; the carrier and broader population significance are still open.'],core:['The paper reports very low-mass objects in IC 348 with a broad absorption feature around 3.4 microns. The feature is strong enough that the authors propose a new spectral class, H.','The key scientific interest is not just the label. It is that JWST is exposing opacity behaviour that existing brown-dwarf atmospheric models do not predict cleanly.','Because IC 348 is young, low gravity and environmentally complex, the feature may be linked to atmospheric chemistry, condensates, disk material, extinction or a combination. Classification needs to be separated from interpretation.'],technical:['The classification argument is morphological: a repeatable spectral feature separates these objects from standard late-type templates. That can justify a provisional class, but not yet a physical explanation.','The 3.4 micron region points naturally toward C-H stretching modes or related hydrocarbon/organic opacity, but the actual carrier depends on temperature, pressure, gravity and condensation state.','A useful next step would be model comparison with candidate molecules and grains under young-brown-dwarf conditions rather than generic spectral identification.'],questions:['Which gas-phase or condensed aliphatic species reproduce the band shape at relevant temperature and pressure?','Do field late-T/Y dwarfs show the same feature, or is it specific to youth, low gravity or IC 348 environment?','Can disk emission, extinction and background contamination be ruled out object-by-object?','How does the feature evolve with age, gravity and effective temperature?'],connection:'This connects to my brown-dwarf work by showing how JWST can reveal missing opacity sources that reshape classification and model fitting. It also reinforces the need to avoid over-interpreting photometric or spectral labels before the physics is secure.',take:'This is a strong discovery note, but the best cold-email angle is cautious: what observations or lab opacities would turn an H-class morphology into a physical atmospheric category?',plots:['JWST/NIRSpec 3.4 micron absorption feature','Comparison with late-T/Y templates','Atmosphere versus disk/extinction decision tree','Feature strength versus luminosity or colour'],prompt:'Photorealistic ultra-low-mass brown dwarf in the IC 348 young star cluster, amber atmosphere, teal nebular dust, subtle infrared spectral arc at 3.4 microns; no text.'},
{slug:'chen-2025-cosmos-web-brown-dwarf-density',title:'Brown Dwarf Number Density in the JWST COSMOS-Web Field',authors:'Amos Y.-A. Chen, Tomotsugu Goto et al.',short:'Chen et al.',year:'2025',theme:'Brown Dwarfs',venue:'PASA · arXiv:2503.18510',read:'12 min read',source:'https://arxiv.org/abs/2503.18510',subtitle:'A photometric census paper that needs explicit confirmation and completeness boundaries.',summary:'COSMOS-Web photometry turns late-T/Y dwarf selection into a kpc-scale Galactic-structure problem, but spectroscopy and completeness remain the key limitations.',why:['I selected this because it connects directly to survey-style brown-dwarf discovery: finding faint objects through colour space, then converting candidates into number densities.','It is useful for my own work because it shows both the power and danger of photometric selection. A clever colour cut is only the first half of the argument.'],core:['The paper uses JWST/COSMOS-Web photometry to identify candidate brown dwarfs, especially late-T/Y-like objects, through their unusual near-infrared colours.','The colour selection is physically motivated. F115W samples a J-band peak, F277W sits near strong molecular absorption, and F444W samples the redder flux. Together they act like a low-resolution SED curvature test.','The scientific step after selection is harder: turning candidates into a number-density estimate requires distance modelling, completeness, contamination control and assumptions about the Galactic population.'],technical:['The method is elegant because it encodes molecular opacity into a three-filter selection. But the same elegance hides catalogue-level risks: photometric scatter, depth variation, unresolved galaxies, point-source classification limits and model-dependent distances.','A number-density result should be read together with a completeness function. Without spectroscopy, the candidate list remains probabilistic.','Model choice matters. Sonora, ATMO and LOWZ-style grids can shift inferred temperatures and distances, changing the density estimate.'],questions:['How many candidates survive NIRSpec confirmation?','What is the completeness and contamination curve versus F444W magnitude?','How large is inter-model scatter between different atmosphere grids?','How do unresolved binaries bias distance and number-density estimates?','Can proper motion or multi-epoch imaging reject extragalactic contaminants?'],connection:'This paper helps me think about brown-dwarf searches as a full pipeline: photometric selection, model fitting, contamination rejection, distance inference and population interpretation. That is directly relevant to my T-dwarf candidate work.',take:'The strongest cold-email angle is to ask how JWST photometric selection can be combined with proper motion, spectroscopy and improved atmosphere models to turn candidates into a robust population measurement.',plots:['Colour-colour selection diagram','Representative SED fits','Number density versus temperature bin','Cumulative counts versus F444W magnitude'],prompt:'Deep-space illustration of a faint brown dwarf in the distant Milky Way disk with a ghostly V-shaped near-infrared spectral curve in teal; no text.'}
];
const themeSwitch=document.getElementById('themeSwitch');if(localStorage.getItem('theme')==='light'){document.body.classList.add('light');themeSwitch.checked=true}themeSwitch.addEventListener('change',()=>{document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function art(src,alt,kind){return `<span class="missing-art"><span>${kind||'Artwork pending'}</span></span><img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none'">`}function linkFor(p){return `papers/${p.slug}/`}
function home(){document.title='Research Reading Journal | Biswajit Jana';let f=PAPERS.find(p=>p.featured)||PAPERS[0];document.getElementById('app').innerHTML=`<section class="hero"><div class="container"><div class="kicker">Research Reading Journal</div><h1>Reading papers actively, not passively.</h1><p class="lead">Close-reading notes on instruments, brown dwarfs, calibration systems, detectors and the papers shaping my PhD direction. Each note is written as a technical reflection: what the paper proves, what remains uncertain, and how it connects to the research questions I want to pursue.</p><div class="toolbar"><input id="searchInput" type="search" placeholder="Search papers, authors, topics..."/><select id="filter"><option value="all">All themes</option>${[...new Set(PAPERS.map(p=>p.theme))].sort().map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="hero-photo"><div class="hero-caption">Paper notes · instrumentation · brown dwarfs · calibration · methods</div></div></div></section><section class="featured-section"><div class="container"><article class="featured-card"><a class="featured-image" href="${linkFor(f)}">${art(`papers/${f.slug}/images/card.jpg`,f.title,'Featured artwork pending')}</a><div class="featured-body"><div class="featured-label">Featured reading note</div><h2>${esc(f.title)}</h2><p>${esc(f.summary)}</p><div class="pillrow"><span>${esc(f.theme)}</span><span>${esc(f.short)} ${esc(f.year)}</span><span>${esc(f.read)}</span></div><a class="button" href="${linkFor(f)}">Read note →</a></div></article></div></section><section class="posts-section"><div class="container"><div class="section-head"><div><div class="kicker">All notes</div><h2>Paper archive</h2></div><p>Each article opens into a standalone reading note with the motivation, core technical argument, open questions, research connection and figure plan.</p></div><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">No papers match your search.</div></div></section>`;const q=document.getElementById('searchInput'),filt=document.getElementById('filter');function render(){let query=q.value.toLowerCase(),cat=filt.value;let items=PAPERS.filter(p=>(cat==='all'||p.theme===cat)&&[p.title,p.authors,p.theme,p.summary,p.subtitle].join(' ').toLowerCase().includes(query));document.getElementById('empty').style.display=items.length?'none':'block';document.getElementById('grid').innerHTML=items.map(p=>`<article class="card"><a class="thumb" href="${linkFor(p)}">${art(`papers/${p.slug}/images/card.jpg`,p.title,p.theme)}</a><div class="card-body"><div class="meta"><span>${esc(p.theme)}</span><span>${esc(p.read)}</span></div><h2>${esc(p.title)}</h2><p>${esc(p.subtitle)}</p><div class="tags"><span class="tag">${esc(p.short)} ${esc(p.year)}</span><span class="tag">Paper note</span></div><a class="read-link" href="${linkFor(p)}">Read note →</a></div></article>`).join('')}q.addEventListener('input',render);filt.addEventListener('change',render);render()}
function section(title,arr){return `<section class="article-card"><h2>${esc(title)}</h2>${arr.map(x=>`<p>${esc(x)}</p>`).join('')}</section>`}
function article(p){document.title=p.title+' | Research Reading Journal';document.getElementById('app').innerHTML=`<header class="article-hero container"><a class="back-link" href="../../index.html">← Back to journal</a><div class="paper-top"><div class="paper-copy"><div class="pillrow"><span>${esc(p.theme)}</span><span>${esc(p.short)} ${esc(p.year)}</span><span>${esc(p.read)}</span></div><h1>${esc(p.title)}</h1><p class="paper-subtitle">${esc(p.subtitle)}</p></div><div class="paper-hero-image">${art(`papers/${p.slug}/images/hero.jpg`,p.title,'Hero artwork pending')}</div></div></header><main class="container article-layout"><aside class="paper-side"><h3>Paper details</h3><div class="mini-row"><strong>Authors</strong>${esc(p.authors)}</div><div class="mini-row"><strong>Venue</strong>${esc(p.venue)}</div><div class="mini-row"><strong>Theme</strong>${esc(p.theme)}</div><div class="mini-row"><strong>Read time</strong>${esc(p.read)}</div><div class="mini-row"><strong>Source</strong><a style="color:var(--accent)" href="${esc(p.source)}" target="_blank" rel="noopener">Original paper</a></div><div class="mini-row"><strong>Image filenames</strong>images/card.jpg<br>images/hero.jpg</div></aside><div class="article-stack">${section('Why I selected this paper',p.why)}${section('Core idea',p.core)}${section('Technical notes',p.technical)}<section class="article-card"><h2>Questions this paper leaves me with</h2><ul>${p.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="article-card"><h2>Connection to my research direction</h2><p>${esc(p.connection)}</p><div class="quote">${esc(p.take)}</div></section><section class="article-card"><h2>Figures and plots to add</h2><p>These slots are ready for the next phase when we add recreated plots, permitted source figures, or your own diagrams with captions.</p><div class="plot-grid">${p.plots.map((x,i)=>`<div class="plot-card"><div class="plot-placeholder">Plot ${i+1}</div><p>${esc(x)}</p></div>`).join('')}</div></section><section class="article-card"><h2>Image prompt for card/hero artwork</h2><p>Use this as the starting prompt for generating a clean card image and a wider hero image.</p><div class="prompt-box">${esc(p.prompt)}</div></section></div></main>`}
