<style>

:.16em;text-transform:uppercase;color:var(--accent);background:rgba(3,7,17,.62);border:1px solid rgba(67,239,208,.22);border-radius:999px;padding:8px 12px}.feature{padding:14px 0 28px}.featured-card{display:grid;grid-template-columns:.95fr 1.05fr;overflow:hidden}.feature-art{position:relative;min-height:360px;overflow:hidden;background:var(--panel2)}.feature-art img,.thumb img,.paper-hero img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}.feature-body{padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;justify-content:center}.feature-body h2{font-family:var(--display);font-size:clamp(2.1rem,4vw,3.75rem);line-height:1;letter-spacing:-.05em;margin-bottom:15px}.feature-body p{color:var(--muted);font-size:1.02rem;margin-bottom:18px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pills span{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--dim);font:800 .68rem var(--mono);background:rgba(255,255,255,.035)}.button{display:inline-flex;width:max-content;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#dffff7);color:#001715;font:950 .76rem var(--mono)}.archive{padding:22px 0 84px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.section-head h2{font-family:var(--display);font-size:clamp(2rem,3vw,3.1rem);letter-spacing:-.045em}.section-head p{max-width:590px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.paper-card{overflow:hidden;transition:.25s}.paper-card:hover{transform:translateY(-6px);border-color:rgba(67,239,208,.35)}.thumb{height:205px;position:relative;overflow:hidden;background:var(--panel2)}.thumb .art-fallback{inset:0;border-radius:0}.thumb img{object-fit:cover}.card-body{padding:20px;display:flex;flex-direction:column;min-height:270px}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--accent);font:850 .69rem var(--mono);margin-bottom:10px}.paper-card h3{font-size:1.17rem;line-height:1.26;margin-bottom:10px;letter-spacing:-.015em}.paper-card p{color:var(--muted);font-size:.94rem;margin-bottom:14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.tag{padding:5px 9px;border-radius:999px;border:1px solid rgba(67,239,208,.18);background:rgba(67,239,208,.08);color:var(--accent);font-size:.70rem;font-weight:850}.read-link{display:inline-flex;margin-top:14px;color:var(--accent);font-weight:900;font-size:.85rem}.article-hero{padding:62px 0 24px}.back{font:900 .74rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.paper-top{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;margin-top:20px;align-items:stretch}.paper-copy{padding:clamp(28px,4vw,48px)}.paper-copy h1{font-family:var(--display);font-size:clamp(2.4rem,5vw,4.3rem);line-height:1;letter-spacing:-.05em;margin-bottom:15px}.paper-sub{color:var(--muted);font-size:1.12rem}.paper-hero{position:relative;overflow:hidden;min-height:390px;border-radius:28px;background:var(--panel2)}.paper-hero .art-fallback{inset:0;border-radius:28px}.paper-hero img{object-fit:cover}.article-layout{display:grid;grid-template-columns:290px 1fr;gap:24px;padding:20px 0 80px}.side-card{padding:20px;position:sticky;top:82px}.side-card h3{margin-bottom:12px}.mini{border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:11px;color:var(--muted);font-size:.9rem;word-break:break-word}.mini strong{display:block;color:var(--text);font:900 .72rem var(--mono);letter-spacing:.11em;text-transform:uppercase;margin-bottom:4px}.article-stack{display:grid;gap:20px}.article-card{padding:clamp(24px,3vw,36px)}.article-card h2{font-family:var(--display);font-size:clamp(1.85rem,3vw,2.55rem);letter-spacing:-.04em;margin-bottom:14px}.article-card p{color:var(--muted);font-size:1.01rem;margin-bottom:15px}.article-card ul{padding-left:20px;color:var(--muted)}.article-card li{margin:9px 0}.quote{border-left:3px solid var(--accent);padding:12px 0 12px 18px;color:var(--text);font-style:italic;background:linear-gradient(90deg,rgba(67,239,208,.06),transparent);border-radius:0 14px 14px 0}.plot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.plot-card{border:1px dashed rgba(67,239,208,.28);border-radius:18px;padding:16px;background:rgba(67,239,208,.04)}.plot-placeholder{height:136px;border-radius:14px;background:linear-gradient(135deg,rgba(67,239,208,.12),rgba(143,179,255,.08));display:grid;place-items:center;color:var(--accent);font:900 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.prompt-box{font-size:.88rem;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:15px;margin-top:10px}.empty{display:none;color:var(--muted);text-align:center;padding:40px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}footer{padding:30px 0 44px;text-align:center;color:var(--dim);border-top:1px solid var(--line);font-size:.88rem}@media(max-width:980px){.hero-grid,.featured-card,.grid,.paper-top,.article-layout{grid-template-columns:1fr}.side-card{position:static}.hero-visual{min-height:330px}.plot-grid{grid-template-columns:1fr}}@media(max-width:680px){.nav-inner{height:auto;padding:12px 0;align-items:flex-start}.hero{padding-top:42px}.toolbar{grid-template-columns:1fr}.section-head{display:block}.thumb{height:220px}.card-body{min-height:auto}.hero h1{font-size:3rem}}

<script>
const PAPERS=[
{slug:'zhao-2026-expres-hidden-systematics',title:'Uncovering Hidden Systematics in Extreme-Precision Radial Velocity Measurements',authors:'Lily L. Zhao, Debra A. Fischer, Andrew E. Szymkowiak, John M. Brewer, Joe Llama',short:'Zhao et al.',year:'2026',theme:'ePRV Systematics',venue:'ApJS · arXiv:2601.02296',read:'14 min read',source:'https://arxiv.org/abs/2601.02296',featured:true,subtitle:'EXPRES shows why long-baseline instrument telemetry is not optional.',summary:'A hidden 2.8 m/s EXPRES instrumental trend, invisible to the standard pipeline, is recovered through multi-star stacking, solar comparison, comb-line diagnostics and two-dimensional echellogram tracking.',why:['I chose this paper because it is almost exactly the kind of diagnostic analysis I expect to need for EXOhSPEC: environmental telemetry, calibration frames, detector geometry and astrophysical measurements all treated as one coupled system.','It is useful for a PhD-facing portfolio because it shows that precision spectroscopy is not only about building a stable instrument. It is also about proving, years later, that the instrument did not write a false planet into the data.'],core:['EXPRES is a stabilised fibre-fed echelle spectrograph with laser-frequency-comb calibration and strong environmental control. Yet seven years of data contained a coherent instrumental drift with trough-to-peak amplitude around 2.8 m/s.','The authors uncover the trend by stacking radial velocities from quiet survey stars and by differencing EXPRES solar data against NEID solar observations. This separates common solar variability from instrument-specific structure.','The paper builds an instrumental state vector from temperature sensors, LFC line-bisector span and two-dimensional echellogram motion. The conceptual shift is that the wavelength solution is not enough.'],technical:['The most useful diagnostic is the move from a scalar RV residual to a multi-dimensional instrument-state model. The design matrix contains normalised tracers such as temperatures, echellogram x/y motion, skew/scale terms and comb-line asymmetry.','The correction reduces the solar RV trend from 1.32 m/s RMS to 0.43 m/s. That changes the detectability of injected planets and removes a suspicious signal in rho CrB residuals.','A PCA or latent-state representation could reveal whether the regression is fitting independent physics or multiple projections of the same thermal mode.'],questions:['Would a PCA/latent-state model show that temperature, LBS and echellogram terms are coupled responses to one thermal mode?','Does the LFC line-bisector span measured near one wavelength represent the full detector?','How much of the remaining long-baseline structure could come from CCD charge-transfer changes?'],connection:'For EXOhSPEC, this paper argues for monitoring cross-dispersion echellogram geometry and environmental telemetry from the start. It gives me a language for describing my own work: a spectrograph is a state-vector system, not merely a wavelength-calibrated box.',take:'This is one of the strongest cold-email leverage papers because the gap is clear and technically mature: how do we design instruments and pipelines so that hidden systematics are discovered before they become planet candidates?',plots:['EXPRES and NEID solar RV trend comparison','Multi-diagnostic time series: temperature, LBS, x/y echellogram motion','Correction cascade showing RMS before and after each tracer family','Injection-recovery grid before and after correction','rho CrB periodogram before and after systematic correction'],prompt:'Scientific cinematic image inside a vacuum-enclosed echelle spectrograph with thermal heat-map contours, laser frequency comb lines, and a glowing detector echellogram; deep navy, teal and amber; no text.'},
{slug:'pepe-2021-espresso-performance',title:'ESPRESSO@VLT: On-Sky Performance and First Results',authors:'F. Pepe et al.',short:'Pepe et al.',year:'2021',theme:'Spectrograph Design',venue:'A&A 645, A96 · arXiv:2010.00316',read:'13 min read',source:'https://arxiv.org/abs/2010.00316',subtitle:'ESPRESSO as an engineering baseline for EPRV spectrograph design.',summary:'ESPRESSO is treated here as a reference architecture for precision radial-velocity instrumentation: vacuum vessel, thermal shells, fibre scrambling, calibration delivery and operational lessons.',why:['I selected this paper because any serious discussion of high-resolution optical radial-velocity spectrographs has to benchmark itself against ESPRESSO.','It is not a paper to read for one headline number. It is a paper to read for the stability hierarchy: what has to be controlled, how tightly, and how failure appears when one subsystem underperforms.'],core:['ESPRESSO represents the mature HARPS-to-ESPRESSO design philosophy: fibre-fed, vacuum-stabilised, thermally nested and calibration-rich.','The paper is valuable because it reports both successes and shortcomings. The multi-shell thermal enclosure, fibre scrambling and vacuum stabilisation are design strengths; the fibre-link throughput issue and early LFC reliability problems are equally instructive.','The key lesson is that 10 cm/s-class instrumental stability is a hierarchy problem. No single subsystem can be allowed to become an unmonitored assumption.'],technical:['The multi-shell enclosure is best understood as multiplicative attenuation: each layer reduces external thermal variation before it reaches the optical bench.','The vacuum vessel removes air refractive-index fluctuations, which is the dominant difference from smaller non-vacuum or partially enclosed systems.','The paper does not fully expose the frequency-domain transfer function of the thermal system. A single RMS stability number does not tell us where the thermal power lives.'],questions:['What is the measured thermal transfer function from the Coudé Laboratory to each shell and to the bench?','How repeatable is the calibration injection geometry after repeated switching?','Does 4-UT mode introduce additional differential optical-path or illumination systematics?'],connection:'For EXOhSPEC the lesson is not to copy ESPRESSO blindly. The lesson is to state the stability chain explicitly: what environmental disturbance enters, what each layer attenuates, and what residual motion reaches the spectrum.',take:'This is a foundational reference for my instrumentation direction and gives the engineering context around which smaller active-control spectrograph experiments can be positioned honestly.',plots:['Thermal-shell attenuation hierarchy','ESPRESSO observing modes and resolution comparison','Calibration architecture: ThAr, FP and LFC roles','Throughput and wavelength coverage summary'],prompt:'Cinematic image of the ESPRESSO spectrograph vacuum vessel in a dark observatory laboratory, nested thermal enclosure panels, teal and steel-blue lighting, fibre-feed lines, no text.'},
{slug:'schmidt-2026-eom-comb-espresso',title:'Test of a 34 GHz EOM Laser Frequency Comb at ESPRESSO',authors:'Tobias M. Schmidt et al.',short:'Schmidt et al.',year:'2026',theme:'Laser Frequency Comb',venue:'arXiv:2603.17908',read:'12 min read',source:'https://arxiv.org/abs/2603.17908',subtitle:'A comb test that also diagnoses calibration-injection systematics.',summary:'The EOM comb result is technically strong, but the most interesting lesson is the calibration-unit mismatch it reveals inside a real operational spectrograph.',why:['I selected this because it connects laser-frequency-comb metrology to the messy reality of a telescope-fed precision spectrograph.','For a cold email, this is useful because the gap is sharp: the source may be stable, but the calibration delivery path can still create large local systematics.'],core:['The paper tests a 34 GHz electro-optic-modulation laser frequency comb at ESPRESSO. A comb can be referenced to an absolute clock, but the spectrograph measures it after coupling, propagation, scrambling, injection geometry, optics and detector sampling.','The reported short-term stability is impressive. The more instructive result is that comparison with the existing calibration unit reveals a local systematic at the many m/s level.','The paper therefore demonstrates a field truth: metrology-grade calibration sources do not automatically produce metrology-grade wavelength solutions unless the illumination geometry is controlled and monitored.'],technical:['The strongest conceptual point is the distinction between source stability and delivered calibration stability.','A comb line can be perfect in frequency and still produce a biased detector centroid if it enters the spectrograph differently from the science light.','The paper should be read together with ESPRESSO performance work and with Fabry-Perot chromatic drift papers because all three show that calibration is a physical subsystem.'],questions:['Is the local calibration-unit systematic static and therefore mappable, or does it vary with time?','Could simultaneous near-field/far-field monitoring have detected the mismatch earlier?','How does the EOM comb compare operationally with a Fabry-Perot etalon in maintenance burden and uptime?'],connection:'For EXOhSPEC this paper sharpens a key design question: does the calibration beam experience the same optical state as the science beam, or only the same nominal path?',take:'The best cold-email angle is not “the comb is good”. It is: how should calibration delivery geometry be measured continuously so a high-grade calibrator does not hide a low-grade injection path?',plots:['EOM comb architecture and mode spacing','Comb signal and background fraction versus wavelength','Local calibration-unit systematic map','Science/calibration injection geometry schematic'],prompt:'Photorealistic optical table with a thin-film lithium niobate waveguide chip emitting visible harmonic light and holographic comb lines; ESPRESSO-like spectrograph silhouette; no text.'},
{slug:'kreider-2025-fabry-perot-chromatic-drift',title:'Quantifying Broadband Chromatic Drifts in Fabry-Perot Resonators for Exoplanet Science',authors:'Molly Kate Kreider, Connor Fredrick, Scott A. Diddams et al.',short:'Kreider et al.',year:'2025',theme:'Calibration',venue:'Nature Astronomy · arXiv:2210.10988',read:'13 min read',source:'https://arxiv.org/abs/2210.10988',subtitle:'Why Fabry-Perot etalons are not simple achromatic rulers.',summary:'White-light Fabry-Perot etalons are convenient dense calibration sources, but this paper shows their drift can be chromatic and physically linked to mirror-coating changes.',why:['I selected this paper because it changes the way I should talk about Fabry-Perot etalons. They are not simply passive forests of stable lines; their mirror coatings are part of the calibration physics.','The paper is highly relevant to supervisors working on EPRV calibration because it turns a practical calibration tool into a materials-stability problem.'],core:['Fabry-Perot etalons are widely used as drift monitors because they provide dense, narrow, evenly spaced lines across wide wavelength ranges.','Kreider et al. show that the assumption of achromatic drift fails at precision levels relevant to exoplanet science.','The physical interpretation is linked to dielectric mirror coatings: small changes in coating thickness or refractive index perturb wavelength-dependent reflective phase.'],technical:['The key equation is the Fabry-Perot resonance condition with a mirror phase term. The cavity length sets the free spectral range, but reflective phase is wavelength dependent.','If the physical cavity length changes uniformly, the drift is achromatic. If the mirror coating phase changes, the drift becomes chromatic.','The result shows how astronomical calibration has reached a regime where thin-film materials physics becomes an RV systematic.'],questions:['Is the observed six-month trend truly linear, or a local approximation to a longer stress-relaxation curve?','Do different coating materials, vendors and deposition processes show the same drift morphology?','Can periodic LFC anchoring make FP-only calibration safe between comb exposures?'],connection:'For EXOhSPEC this is a warning that a passive calibrator is not physically simple just because it is operationally simpler than a comb. Any long-term calibration source needs its own ageing model.',take:'The strongest research gap is long-term predictability. If coating relaxation is nonlinear over years, old FP-calibrated RV archives may carry structured wavelength-dependent errors.',plots:['Chromatic drift pattern across wavelength','Fabry-Perot resonance condition with mirror phase','Coating-layer perturbation schematic','LFC-anchored monitoring strategy over years'],prompt:'Close-up photorealistic Fabry-Perot etalon in a vacuum chamber, rainbow mirror coatings, evenly spaced spectral lines drifting subtly from blue to amber; no text.'},
{slug:'sercel-2024-thermal-control-delay-lines',title:'Thermal Control of Long Delay Lines in a High-Resolution Astrophotonic Spectrograph',authors:'Gregory P. Sercel, Pradip R. Gatkine, Nemanja Jovanovic et al.',short:'Sercel et al.',year:'2024',theme:'Thermal Control',venue:'SPIE · arXiv:2403.10019',read:'11 min read',source:'https://arxiv.org/abs/2403.10019',subtitle:'A compact thermal-control paper with a clear tolerance chain.',summary:'A silicon-nitride astrophotonic Fourier-transform spectrograph needs long delay-line stability, making temperature control a direct optical-path-length requirement.',why:['I selected this because the logic is close to my EXOhSPEC work even though the platform is astrophotonic.','It shows how to justify a temperature-control requirement from the optical measurement rather than presenting PID control as an isolated engineering detail.'],core:['The paper studies thermal control of long delay lines in a high-resolution astrophotonic spectrograph. Silicon nitride waveguides are compact but temperature sensitive.','The system uses a thermoelectric cooler, temperature sensing and PID-style control to stabilise the chip so that interferometric phase remains usable.','For me, the central lesson is that a thermal controller should be evaluated through the optical quantity it protects. Temperature stability is not the final metric; phase or optical path stability is.'],technical:['The strongest section is the translation from spectrograph resolution and delay length into thermal stability.','A single sensor may stabilise the mounting plate but not necessarily resolve intra-chip gradients.','The paper would become stronger with frequency-domain phase-noise analysis. RMS temperature stability alone does not reveal whether noise is harmful on exposure timescales.'],questions:['What is the phase-noise power spectral density in the 1–60 second band relevant to exposures?','How large are intra-chip thermal gradients when different heaters or phase shifters are active?','Can feed-forward correction during known thermal switching events reduce settling time?'],connection:'For EXOhSPEC, this paper gives a clean template: start from the optical tolerance, derive the thermal tolerance, then evaluate the controller through measured OPL or pixel stability rather than temperature alone.',take:'This is valuable because it makes thermal control feel like optical metrology rather than electronics housekeeping.',plots:['Tolerance chain from resolving power to temperature stability','PID thermal settling curve','Fringe phase-error measurement','Sensor placement and gradient-risk schematic'],prompt:'Macro photorealistic silicon nitride photonic chip on a thermoelectric cooler with glowing waveguide spirals and a stable interference fringe; no text.'},
{slug:'khandelwal-2024-scmos-detectors',title:'Beyond CCDs: Characterization of sCMOS Detectors for Optical Astronomy',authors:'Aditya Khandelwal, Sarik Jeram, Ryan Dungee et al.',short:'Khandelwal et al.',year:'2024',theme:'Detectors',venue:'SPIE · arXiv:2409.16449',read:'12 min read',source:'https://arxiv.org/abs/2409.16449',subtitle:'A careful imaging detector paper, but not yet an EPRV detector proof.',summary:'Modern sCMOS detectors are becoming attractive as CCD supply declines, but precision spectroscopy needs additional tests beyond standard imaging characterisation.',why:['I selected this because detector choice is becoming a real instrument-design constraint, not just a performance preference.','I wanted to read it as a spectroscopist: not only “is the image clean?”, but “does the detector preserve line centroids well enough for precision spectroscopy?”'],core:['The paper characterises several commercial sCMOS detectors using metrics such as conversion gain, read noise, dark current, linearity and quantum efficiency.','For imaging, these results are encouraging. For precision spectroscopy, they are necessary but incomplete.','The paper opens the door to sCMOS astronomy, but it does not close the detector-systematics question for high-stability spectrographs.'],technical:['The photon-transfer-curve analysis links ADU to electrons and separates read-noise behaviour from photon noise.','PTCs do not directly test intra-pixel response, inter-pixel capacitance or spectroscopic centroid stability.','For EPRV work, the decisive experiment would be a stable line source or etalon measured repeatedly as a function of signal level, temperature and illumination pattern.'],questions:['What is the low-light non-linearity below about 100 electrons?','How much fixed-pattern-noise residual remains after flat-fielding in spectroscopic extraction?','What are the inter-pixel capacitance and cross-talk kernels for the best-performing devices?'],connection:'For EXOhSPEC-style spectroscopy, this paper is a starting point for detector selection. It identifies promising devices but clarifies what extra tests are needed before claiming RV suitability.',take:'The strongest improvement would be an RV-specific detector benchmark: stable emission/comb lines, repeated centroiding and a detector-induced velocity error budget.',plots:['Detector comparison table','Photon transfer curve schematic','Low-light non-linearity test plan','Spectral-line centroid stability experiment'],prompt:'Macro photorealistic sCMOS detector array on a gold PCB inside a cooled camera housing, pixel grid catching teal-blue light, oscilloscope glow; no text.'},
{slug:'luhman-2025-ic348-h-class-brown-dwarfs',title:'A New Spectral Class of Brown Dwarfs at the Bottom of the IMF in IC 348',authors:'K. L. Luhman and C. Alves de Oliveira',short:'Luhman & Alves de Oliveira',year:'2025',theme:'Brown Dwarfs',venue:'ApJ Letters · arXiv:2506.08969',read:'12 min read',source:'https://arxiv.org/abs/2506.08969',subtitle:'A JWST discovery note that should stay cautious about the proposed H class.',summary:'JWST/NIRSpec reveals a broad 3.4 micron feature in very low-mass IC 348 objects, raising classification and opacity questions for young brown dwarfs.',why:['I selected this because it is close to my brown-dwarf survey interests but also shows the danger of classification outrunning physical interpretation.','The paper is exciting, but the best reading is cautious: the spectral morphology is real; the carrier and broader population significance are still open.'],core:['The paper reports very low-mass objects in IC 348 with a broad absorption feature around 3.4 microns.','The key scientific interest is not just the label. It is that JWST is exposing opacity behaviour that existing brown-dwarf atmospheric models do not predict cleanly.','Because IC 348 is young, low gravity and environmentally complex, the feature may be linked to atmospheric chemistry, condensates, disk material, extinction or a combination.'],technical:['The classification argument is morphological: a repeatable spectral feature separates these objects from standard late-type templates.','The 3.4 micron region points naturally toward C-H stretching modes or related hydrocarbon/organic opacity, but the actual carrier depends on temperature, pressure, gravity and condensation state.','A useful next step would be model comparison with candidate molecules and grains under young-brown-dwarf conditions.'],questions:['Which gas-phase or condensed aliphatic species reproduce the band shape at relevant temperature and pressure?','Do field late-T/Y dwarfs show the same feature, or is it specific to youth, low gravity or IC 348 environment?','Can disk emission, extinction and background contamination be ruled out object-by-object?'],connection:'This connects to my brown-dwarf work by showing how JWST can reveal missing opacity sources that reshape classification and model fitting. It also reinforces the need to avoid over-interpreting labels before the physics is secure.',take:'The best cold-email angle is cautious: what observations or lab opacities would turn an H-class morphology into a physical atmospheric category?',plots:['JWST/NIRSpec 3.4 micron absorption feature','Comparison with late-T/Y templates','Atmosphere versus disk/extinction decision tree','Feature strength versus luminosity or colour'],prompt:'Photorealistic ultra-low-mass brown dwarf in the IC 348 young star cluster, amber atmosphere, teal nebular dust, subtle infrared spectral arc at 3.4 microns; no text.'},
{slug:'chen-2025-cosmos-web-brown-dwarf-density',title:'Brown Dwarf Number Density in the JWST COSMOS-Web Field',authors:'Amos Y.-A. Chen, Tomotsugu Goto et al.',short:'Chen et al.',year:'2025',theme:'Brown Dwarfs',venue:'PASA · arXiv:2503.18510',read:'12 min read',source:'https://arxiv.org/abs/2503.18510',subtitle:'A photometric census paper that needs explicit confirmation and completeness boundaries.',summary:'COSMOS-Web photometry turns late-T/Y dwarf selection into a kpc-scale Galactic-structure problem, but spectroscopy and completeness remain the key limitations.',why:['I selected this because it connects directly to survey-style brown-dwarf discovery: finding faint objects through colour space, then converting candidates into number densities.','It shows both the power and danger of photometric selection. A clever colour cut is only the first half of the argument.'],core:['The paper uses JWST/COSMOS-Web photometry to identify candidate brown dwarfs, especially late-T/Y-like objects, through their unusual near-infrared colours.','The colour selection is physically motivated. F115W samples a J-band peak, F277W sits near strong molecular absorption, and F444W samples the redder flux.','Turning candidates into a number-density estimate requires distance modelling, completeness, contamination control and assumptions about the Galactic population.'],technical:['The method encodes molecular opacity into a three-filter selection. But it inherits catalogue-level risks: photometric scatter, depth variation, unresolved galaxies and model-dependent distances.','A number-density result should be read together with a completeness function. Without spectroscopy, the candidate list remains probabilistic.','Model choice matters: atmosphere grids can shift inferred temperatures and distances, changing the density estimate.'],questions:['How many candidates survive NIRSpec confirmation?','What is the completeness and contamination curve versus F444W magnitude?','How large is inter-model scatter between different atmosphere grids?'],connection:'This paper helps me think about brown-dwarf searches as a full pipeline: photometric selection, model fitting, contamination rejection, distance inference and population interpretation.',take:'The strongest cold-email angle is to ask how JWST photometric selection can be combined with proper motion, spectroscopy and improved atmosphere models to turn candidates into a robust population measurement.',plots:['Colour-colour selection diagram','Representative SED fits','Number density versus temperature bin','Cumulative counts versus F444W magnitude'],prompt:'Deep-space illustration of a faint brown dwarf in the distant Milky Way disk with a ghostly V-shaped near-infrared spectral curve in teal; no text.'}
];
const themeSwitch=document.getElementById('themeSwitch');if(localStorage.getItem('theme')==='light'){document.body.classList.add('light');themeSwitch.checked=true}themeSwitch.addEventListener('change',()=>{document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function art(base,alt,label){return `<div class="art-fallback"><span>${esc(label||'Artwork pending')}</span></div><img src="${esc(base)}.png" alt="${esc(alt)}" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="if(!this.dataset.jpg){this.dataset.jpg='1';this.src='${esc(base)}.jpg'}else{this.style.display='none';this.previousElementSibling.style.display='grid'}">`}
function linkFor(p){return `papers/${p.slug}/`}
function home(){document.title='Research Reading Journal | Biswajit Jana';let f=PAPERS.find(p=>p.featured)||PAPERS[0];document.getElementById('app').innerHTML=`<section class="hero"><div class="container hero-grid"><div class="hero-copy"><div class="kicker">Research Reading Journal</div><h1>Reading papers actively, not passively.</h1><p class="lead">Close-reading notes on instruments, brown dwarfs, calibration systems, detectors and the papers shaping my PhD direction. Each note asks what the paper proves, what remains uncertain, and how it connects to the research questions I want to pursue.</p><div class="toolbar"><input id="searchInput" type="search" placeholder="Search papers, authors, topics..."><select id="filter"><option value="all">All themes</option>${[...new Set(PAPERS.map(p=>p.theme))].sort().map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div><div class="hero-visual">${art('assets/images/journal-hero','Research reading journal hero','Journal artwork')}<div class="hero-caption">Paper notes · instrumentation · brown dwarfs · calibration · methods</div></div></div></section><section class="feature"><div class="container"><article class="featured-card"><a class="feature-art" href="${linkFor(f)}">${art(`papers/${f.slug}/images/card`,f.title,'Featured artwork')}</a><div class="feature-body"><div class="kicker">Featured reading note</div><h2>${esc(f.title)}</h2><p>${esc(f.summary)}</p><div class="pills"><span>${esc(f.theme)}</span><span>${esc(f.short)} ${esc(f.year)}</span><span>${esc(f.read)}</span></div><a class="button" href="${linkFor(f)}">Read note →</a></div></article></div></section><section class="archive"><div class="container"><div class="section-head"><div><div class="kicker">All notes</div><h2>Paper archive</h2></div><p>Each article opens into a standalone reading note with motivation, technical argument, open questions, research connection and figure plan.</p></div><div id="grid" class="grid"></div><div id="empty" class="empty">No papers match your search.</div></div></section>`;const q=document.getElementById('searchInput'),filt=document.getElementById('filter');function render(){let query=q.value.toLowerCase(),cat=filt.value;let items=PAPERS.filter(p=>(cat==='all'||p.theme===cat)&&[p.title,p.authors,p.theme,p.summary,p.subtitle].join(' ').toLowerCase().includes(query));document.getElementById('empty').style.display=items.length?'none':'block';document.getElementById('grid').innerHTML=items.map(p=>`<article class="paper-card"><a class="thumb" href="${linkFor(p)}">${art(`papers/${p.slug}/images/card`,p.title,p.theme)}</a><div class="card-body"><div class="meta"><span>${esc(p.theme)}</span><span>${esc(p.read)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.subtitle)}</p><div class="tags"><span class="tag">${esc(p.short)} ${esc(p.year)}</span><span class="tag">Paper note</span></div><a class="read-link" href="${linkFor(p)}">Read note →</a></div></article>`).join('')}q.addEventListener('input',render);filt.addEventListener('change',render);render()}
function block(title,arr){return `<section class="article-card"><h2>${esc(title)}</h2>${arr.map(x=>`<p>${esc(x)}</p>`).join('')}</section>`}
function article(p){document.title=p.title+' | Research Reading Journal';document.getElementById('app').innerHTML=`<header class="article-hero container"><a class="back" href="../../index.html">← Back to journal</a><div class="paper-top"><div class="paper-copy"><div class="pills"><span>${esc(p.theme)}</span><span>${esc(p.short)} ${esc(p.year)}</span><span>${esc(p.read)}</span></div><h1>${esc(p.title)}</h1><p class="paper-sub">${esc(p.subtitle)}</p></div><div class="paper-hero">${art(`papers/${p.slug}/images/hero`,p.title,'Hero artwork')}</div></div></header><main class="container article-layout"><aside class="side-card"><h3>Paper details</h3><div class="mini"><strong>Authors</strong>${esc(p.authors)}</div><div class="mini"><strong>Venue</strong>${esc(p.venue)}</div><div class="mini"><strong>Theme</strong>${esc(p.theme)}</div><div class="mini"><strong>Read time</strong>${esc(p.read)}</div><div class="mini"><strong>Source</strong><a style="color:var(--accent)" href="${esc(p.source)}" target="_blank" rel="noopener">Original paper</a></div><div class="mini"><strong>Accepted image names</strong>images/card.png or card.jpg<br>images/hero.png or hero.jpg</div></aside><div class="article-stack">${block('Why I selected this paper',p.why)}${block('Core idea',p.core)}${block('Technical notes',p.technical)}<section class="article-card"><h2>Questions this paper leaves me with</h2><ul>${p.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="article-card"><h2>Connection to my research direction</h2><p>${esc(p.connection)}</p><div class="quote">${esc(p.take)}</div></section><section class="article-card"><h2>Figures and plots to add</h2><p>These slots are ready for the next phase when we add recreated plots, permitted source figures, or your own diagrams with captions.</p><div class="plot-grid">${p.plots.map((x,i)=>`<div class="plot-card"><div class="plot-placeholder">Plot ${i+1}</div><p>${esc(x)}</p></div>`).join('')}</div></section><section class="article-card"><h2>Image prompt for card/hero artwork</h2><p>Use this as the starting prompt for generating a clean card image and a wider hero image.</p><div class="prompt-box">${esc(p.prompt)}</div></section></div></main>`}
let params=new URLSearchParams(location.search);let slug=params.get('paper')||location.pathname.split('/').filter(Boolean).pop();let p=PAPERS.find(x=>x.slug===slug);p?article(p):home();
(function(){const c=document.getElementById('simBg'),ctx=c.getContext('2d');let w,h,dpr,stars=[],nodes=[],t=0;function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(120,Math.floor(innerWidth/12))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.25,v:Math.random()*.18+.03,p:Math.random()*6.28}));nodes=Array.from({length:34},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.14}))}function draw(){t+=.006;ctx.clearRect(0,0,innerWidth,innerHeight);const light=document.body.classList.contains('light');ctx.globalCompositeOperation='source-over';for(const s of stars){s.y+=s.v;if(s.y>innerHeight+4){s.y=-4;s.x=Math.random()*innerWidth}const a=(light?.20:.44)*(0.55+0.45*Math.sin(t*8+s.p));ctx.fillStyle=light?`rgba(20,70,120,${a})`:`rgba(210,240,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.lineWidth=1;for(let k=0;k<5;k++){let y=innerHeight*(.18+k*.15)+Math.sin(t*30+k)*18;let grad=ctx.createLinearGradient(0,y,innerWidth,y);grad.addColorStop(0,'rgba(67,239,208,0)');grad.addColorStop(.35,light?'rgba(0,141,127,.16)':'rgba(67,239,208,.18)');grad.addColorStop(.55,light?'rgba(49,95,233,.14)':'rgba(143,179,255,.16)');grad.addColorStop(1,'rgba(255,208,114,0)');ctx.strokeStyle=grad;ctx.beginPath();for(let x=0;x<=innerWidth;x+=18){let yy=y+Math.sin(x*.018+t*60+k)*5+Math.sin(x*.053+t*35)*2;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke()}for(const n of nodes){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>innerWidth)n.vx*=-1;if(n.y<0||n.y>innerHeight)n.vy*=-1}ctx.strokeStyle=light?'rgba(0,141,127,.09)':'rgba(67,239,208,.10)';ctx.fillStyle=light?'rgba(0,141,127,.25)':'rgba(67,239,208,.28)';for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);if(dist<145){ctx.globalAlpha=1-dist/145;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}ctx.globalAlpha=1;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,1.35,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}window.addEventListener('resize',resize);resize();draw()})();
</script></body></html>
