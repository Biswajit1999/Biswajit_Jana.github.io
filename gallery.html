<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmos Gallery — Biswajit Jana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:        #00000c;
  --card:      rgba(4,8,22,0.88);
  --text:      #dde3f5;
  --muted:     #6e7a9e;
  --accent:    #42a5f5;
  --purple:    #ab47bc;
  --cyan:      #26c6da;
  --gold:      #ffa726;
  --b-dim:     rgba(66,165,245,0.10);
  --glow:      rgba(66,165,245,0.25);
}

html{scroll-behavior:smooth;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#000010;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent),var(--purple));border-radius:2px;}

#star-cvs{position:fixed;inset:0;z-index:0;pointer-events:none;}
.neb-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.nb{position:absolute;border-radius:50%;filter:blur(115px);animation:nbDrift 30s ease-in-out infinite alternate;}
.nb1{width:700px;height:700px;background:radial-gradient(circle,#0d47a130,transparent);top:-180px;left:-200px;opacity:.55;animation-duration:42s;}
.nb2{width:560px;height:560px;background:radial-gradient(circle,#4a148c25,transparent);top:35%;right:-130px;opacity:.45;animation-duration:36s;animation-delay:-7s;}
@keyframes nbDrift{from{transform:translate(0,0) scale(1);}to{transform:translate(36px,28px) scale(1.06);}}

#loading{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3rem;transition:opacity 0.8s ease;}
#loading.done{opacity:0;pointer-events:none;}
.ld-orb{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#1e88e5,#0a1855);box-shadow:0 0 28px rgba(66,165,245,0.7),0 0 55px rgba(66,165,245,0.2);animation:orbFloat 1.9s ease-in-out infinite;}
.ld-txt{font-family:'Orbitron',monospace;font-size:0.68rem;letter-spacing:0.45em;text-transform:uppercase;color:var(--accent);}
@keyframes orbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-11px);}}

/* ═══════════════════════════════════════
   PROFESSIONAL NAVBAR (single, integrated)
═══════════════════════════════════════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 2rem;
  background:rgba(0,0,10,0.5);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--b-dim);
  transition:background 0.3s;
}
.nav.scrolled{background:rgba(0,0,14,0.8);}

.nav-left{display:flex;align-items:center;gap:3rem;}
.nav-brand{
  font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;
  letter-spacing:0.18em;text-decoration:none;
  background:linear-gradient(90deg,var(--accent),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.nav-menu{
  display:flex;gap:1.8rem;list-style:none;
  font-family:'Space Mono',monospace;
  font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;
}

.nav-menu a{
  color:var(--muted);text-decoration:none;
  transition:color 0.2s,border-color 0.2s;
  padding:0.3rem 0;border-bottom:1px solid transparent;
  cursor:pointer;
}
.nav-menu a:hover{color:var(--accent);border-color:var(--accent);}

#hero{
  position:relative;width:100%;height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:8vh;overflow:hidden;margin-top:0;
}

#earth-mount{position:absolute;inset:0;z-index:1;cursor:grab;}
#earth-mount.dragging{cursor:grabbing;}

#hero::after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 28%,rgba(0,0,12,0.52) 68%,rgba(0,0,12,0.93) 100%);
}

.hero-text{position:relative;z-index:3;text-align:center;padding:0 2rem;max-width:800px;}
.hero-eyebrow{
  font-family:'Space Mono',monospace;font-size:0.64rem;
  letter-spacing:0.44em;text-transform:uppercase;color:var(--cyan);
  margin-bottom:0.85rem;opacity:0;animation:riseUp .9s ease .5s forwards;
}
.hero-name{
  font-family:'Orbitron',monospace;
  font-size:clamp(2.5rem,6.5vw,5.8rem);font-weight:900;
  letter-spacing:0.06em;line-height:1.04;text-transform:uppercase;
  background:linear-gradient(140deg,#fff 0%,var(--accent) 38%,var(--purple) 70%,#fff 100%);
  background-size:280% 280%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 7s ease infinite, riseUp .9s ease .7s both;
}
.hero-role{
  font-size:0.82rem;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--muted);margin:0.5rem 0 0;
  opacity:0;animation:riseUp .9s ease .9s forwards;
}

@keyframes shimmer{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes riseUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

/* ═══════════════════════════════════════
   GALLERY SECTION (clean, centered)
═══════════════════════════════════════ */
#gallery{
  position:relative;z-index:10;
  padding:5rem 2rem;
  background:linear-gradient(180deg,rgba(0,0,10,0) 0%,rgba(2,5,18,0.97) 5%,rgba(2,5,18,0.97) 95%,rgba(0,0,10,0) 100%);
  min-height:auto;
}

.gal-container{
  max-width:1200px;margin:0 auto;
}

.gal-head{text-align:center;margin-bottom:3rem;}
.gal-eye{
  font-family:'Space Mono',monospace;font-size:0.64rem;
  letter-spacing:0.42em;text-transform:uppercase;color:var(--cyan);margin-bottom:0.8rem;
}
.gal-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;letter-spacing:0.04em;
  background:linear-gradient(135deg,var(--text),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:0.8rem;
}
.gal-sub{font-size:0.9rem;color:var(--muted);max-width:600px;margin:0 auto;}

/* SEARCH & FILTERS */
.controls-wrap{
  display:flex;flex-direction:column;gap:2rem;
  margin-bottom:2.5rem;
}

.search-box{
  position:relative;max-width:400px;margin:0 auto;width:100%;
}
.search-box input{
  width:100%;padding:11px 14px 11px 38px;
  border-radius:12px;border:1px solid var(--b-dim);
  background:rgba(66,165,245,0.08);color:var(--text);
  font-family:'Space Grotesk',sans-serif;font-size:0.95rem;
  transition:all 0.25s;
}
.search-box input:focus{
  outline:none;border-color:var(--accent);
  background:rgba(66,165,245,0.12);
  box-shadow:0 0 0 3px rgba(66,165,245,0.15);
}
.search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;opacity:0.5;
}

.filters{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.filter-btn{
  padding:10px 16px;border-radius:999px;border:1px solid var(--b-dim);
  background:transparent;color:var(--muted);
  font-family:'Space Mono',monospace;font-size:0.75rem;
  text-transform:uppercase;letter-spacing:0.08em;
  cursor:pointer;transition:all 0.25s;
}
.filter-btn:hover,.filter-btn.active{
  border-color:var(--accent);color:var(--accent);
  background:rgba(66,165,245,0.12);
}

/* CAROUSEL */
.slider-wrap{
  position:relative;width:100%;max-width:1100px;
  margin:0 auto 3rem;
}

.slider-stage{
  position:relative;width:100%;overflow:hidden;
  border-radius:16px;border:1px solid var(--b-dim);
  box-shadow:0 0 80px rgba(0,0,0,0.8),0 0 40px var(--glow);
  background:#000;
  min-height:500px;
  max-height:70vh;
  display:flex;align-items:center;justify-content:center;
}

.slide{
  position:absolute;inset:0;opacity:0;
  transition:opacity 0.6s ease;
}
.slide.active{opacity:1;z-index:2;}
.slide img{
  width:100%;height:100%;object-fit:contain;
  transition:transform 0.3s ease;
}

.slide-ov{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,0.3) 40%,rgba(0,0,0,0.9) 100%);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:32px;color:var(--text);
  opacity:0;transition:opacity 0.5s ease;
}
.slide.active .slide-ov{opacity:1;}

.slide-tag{
  font-family:'Space Mono',monospace;font-size:0.72rem;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:12px;display:inline-block;
  padding:6px 12px;border-radius:999px;
  background:rgba(38,198,218,0.15);border:1px solid rgba(38,198,218,0.3);
}
.slide-title{
  font-family:'Orbitron',monospace;font-size:1.6rem;
  font-weight:700;line-height:1.2;max-width:90%;
}
.slide-num{
  position:absolute;top:18px;right:18px;
  font-family:'Space Mono',monospace;font-size:0.8rem;
  color:var(--muted);background:rgba(0,0,0,0.6);
  padding:8px 12px;border-radius:8px;
}

.zoom-controls{
  position:absolute;top:18px;left:18px;z-index:20;
  display:flex;gap:8px;
}
.zoom-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--accent);background:rgba(66,165,245,0.1);
  color:var(--accent);font-size:1.1rem;cursor:pointer;
  transition:all 0.25s;display:flex;align-items:center;justify-content:center;
}
.zoom-btn:hover{background:rgba(66,165,245,0.25);transform:scale(1.08);}

.arr{
  position:absolute;top:50%;z-index:20;transform:translateY(-50%);
  width:50px;height:50px;border-radius:50%;
  border:1.5px solid var(--accent);background:rgba(66,165,245,0.1);
  color:var(--accent);font-size:1.4rem;cursor:pointer;
  transition:all 0.25s;display:flex;align-items:center;justify-content:center;
}
.arr:hover{background:rgba(66,165,245,0.25);transform:translateY(-50%) scale(1.08);}
.arr-p{left:18px;}
.arr-n{right:18px;}

.dots{
  position:absolute;bottom:18px;left:50%;
  transform:translateX(-50%);z-index:20;
  display:flex;gap:7px;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.3);cursor:pointer;
  transition:all 0.3s;
}
.dot.on{
  background:var(--accent);box-shadow:0 0 12px var(--accent);
  width:24px;border-radius:4px;
}

.thumbs{
  position:absolute;bottom:18px;right:18px;
  display:flex;gap:7px;z-index:20;
  overflow-x:auto;padding:0 8px;
  max-width:200px;
}
.thumb{
  width:50px;height:50px;border-radius:8px;
  border:1px solid var(--b-dim);overflow:hidden;
  cursor:pointer;transition:all 0.25s;flex-shrink:0;
}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb:hover{border-color:var(--accent);transform:scale(1.05);}
.thumb.on{border-color:var(--accent);box-shadow:0 0 12px rgba(66,165,245,0.5);}

/* FOOTER */
footer{
  position:relative;z-index:10;
  padding:40px 20px;text-align:center;
  border-top:1px solid var(--b-dim);
  background:linear-gradient(to top,rgba(0,0,14,0.6),transparent);
}
.footer-copy{
  font-family:'Space Mono',monospace;font-size:0.82rem;
  color:var(--muted);margin-bottom:6px;letter-spacing:0.05em;
}
.footer-copy strong{color:var(--accent);font-weight:600;}

  </style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ════════════════════════════════════════════════════════════════
   IMAGE SETUP INSTRUCTIONS:
   
   1. Create folder: My%20Gallery (or "My Gallery")
      Location: /Biswajit_Jana.github.io/My Gallery/
   
   2. Add images to that folder (all formats: .png, .jpg, etc)
   
   3. Update IMAGES array below with your filenames
   
   The system auto-detects categories from image names:
   - Contains "supernova", "magnetar", "flare" → STELLAR
   - Contains "europa", "saturn", "planet" → PLANETARY
   - Contains "exoplanet", "hot jupiter" → EXOPLANET
   - Contains "black hole", "cosmic", "pulsar" → COSMOLOGY
   - Contains "eprv", "spectrograph" → INSTRUMENTATION
════════════════════════════════════════════════════════════════ */

const CATEGORY_KEYWORDS = {
  stellar: ['magnetar', 'supernova', 'type ia', 'flare', 'star'],
  planetary: ['europa', 'saturn', 'hexagon', 'protoplanetary', 'planet', 'disk'],
  exoplanet: ['hot jupiter', 'exoplanet', 'atmosphere', 'alien', 'transmission'],
  cosmology: ['cosmic web', 'dark matter', 'black hole', 'pulsar', 'merger', 'nebula', 'spacetime'],
  instrumentation: ['eprv', 'spectrograph', 'optical', 'bench'],
};

function detectCategory(filename) {
  const lower = filename.toLowerCase();
  for (const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    if (keywords.some(kw => lower.includes(kw))) return cat;
  }
  return 'cosmology';
}

// UPDATE THIS WITH YOUR ACTUAL IMAGE FILENAMES
const IMAGES = [
  { file: 'Type Ia supernova infographic explosion.png', title: 'Standard Candle — Type Ia Supernova Detonation' },
  { file: 'Planet formation in a protoplanetary disk.png', title: 'Planet Birth — Protoplanetary Disk Gap Carving' },
  { file: 'cosmic web - dark matter.png', title: 'The Cosmic Web — Dark Matter\'s Skeleton' },
  { file: 'Europa\'s ocean beneath the ice.png', title: 'Europa — Ocean World Beneath the Ice' },
  { file: 'Spacetime shattered black hole merger poster.png', title: 'Spacetime Shattered — Binary Black Hole Merger' },
  { file: 'EPRV cutaway details.png', title: 'EPRV Échelle Spectrograph — Optical Bench' },
  { file: 'Magnetar Giant Flare.png', title: 'Magnetar Giant Flare — SGR 1806-20' },
  { file: 'Saturn\'s north pole hexagon infographic.png', title: 'Saturn\'s North Polar Hexagon — Standing Atmospheric Wave' },
  { file: 'Pulsar wind nebula scientific infographic.png', title: 'Pulsar Wind Nebula — Relativistic Particle Accelerator' },
  { file: 'Exploring alien atmospheres - Hot Jupiter spectroscopy.png', title: 'Reading an Alien Atmosphere — Transmission Spectroscopy' },
];

const images = IMAGES.map((img, idx) => ({
  ...img,
  category: detectCategory(img.file),
  num: idx + 1,
  src: `My%20Gallery/${encodeURIComponent(img.file)}`,
}));

let allCategories = ['all', ...new Set(images.map(i => i.category))];
let current = 0, filteredIndices = images.map((_, i) => i);
let currentZoom = 1;

/* STARFIELD */
const cvs = document.getElementById('star-cvs');
const ctx = cvs.getContext('2d');
let W, H, stars = [], comets = [];

function initCanvas() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 400; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 0.9 + 0.15, op: Math.random() * 0.7 + 0.2,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.08 + 0.01,
      color: ['#dde3f5', '#42a5f5', '#26c6da'][Math.floor(Math.random() * 3)],
    });
  }
  for (let i = 0; i < 3; i++) {
    comets.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
      trail: 100, life: Math.random() * 15000,
    });
  }
}
initCanvas();
window.addEventListener('resize', initCanvas);

function drawStarfield(t) {
  ctx.fillStyle = 'rgba(0,0,12,0.08)';
  ctx.fillRect(0, 0, W, H);
  stars.forEach(s => {
    s.twinklePhase += s.twinkleSpeed;
    const twinkle = Math.sin(s.twinklePhase) * 0.4 + 0.6;
    ctx.globalAlpha = s.op * twinkle;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  comets.forEach(comet => {
    comet.life += 1;
    if (comet.life > 15000) {
      comet.x = Math.random() * W;
      comet.y = Math.random() * H;
      comet.vx = (Math.random() - 0.5) * 5;
      comet.vy = (Math.random() - 0.5) * 5;
      comet.life = 0;
    }
    ctx.strokeStyle = `rgba(42,165,245,${0.5 * (1 - comet.life / 15000)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(comet.x - comet.vx * comet.trail, comet.y - comet.vy * comet.trail);
    ctx.lineTo(comet.x, comet.y);
    ctx.stroke();
    ctx.globalAlpha = 1 - (comet.life / 15000);
    ctx.fillStyle = '#42a5f5';
    ctx.beginPath();
    ctx.arc(comet.x, comet.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
    comet.x += comet.vx;
    comet.y += comet.vy;
  });
  ctx.globalAlpha = 1;
}

/* 3D EARTH */
let scene, cam, renderer, earth, clouds, atmo, eGroup;
let rotX = 0, rotY = 0, velX = 0, velY = 0;
let isDragging = false, prevDX = 0, prevDY = 0;
const DRAG_SENSITIVITY_X = 0.005, DRAG_SENSITIVITY_Y = 0.005, ROT_X_MAX = Math.PI / 2.5, INERTIA_DAMPING = 0.95;
let texDone = 0;

function initEarth() {
  const mount = document.getElementById('earth-mount');
  const W = mount.clientWidth, H = mount.clientHeight;

  scene = new THREE.Scene();
  cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 1000);
  cam.position.set(0, 0.15, 6.2);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.domElement.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
  mount.appendChild(renderer.domElement);

  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(5, 1.5, 3);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x0d1a44, 0.5));
  scene.add(new THREE.HemisphereLight(0x001133, 0x000000, 0.3));

  eGroup = new THREE.Group();
  scene.add(eGroup);
  eGroup.rotation.z = THREE.MathUtils.degToRad(23.4);

  const tl = new THREE.TextureLoader();
  tl.crossOrigin = 'anonymous';
  const onTex = () => { if (++texDone >= 2) finishLoad(); };

  const tDay   = tl.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg', onTex);
  const tNight = tl.load('https://unpkg.com/three-globe/example/img/earth-night.jpg', onTex);
  const tCloud = tl.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');
  const tBump  = tl.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(2, 72, 72),
    new THREE.ShaderMaterial({
      uniforms: {
        uDay: { value: tDay }, uNight: { value: tNight },
        uBump: { value: tBump },
        uSun: { value: new THREE.Vector3(5, 1.5, 3).normalize() },
      },
      vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vP;
        void main(){vUv=uv;vN=normalize(normalMatrix*normal);vP=(modelViewMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader: `uniform sampler2D uDay; uniform sampler2D uNight; uniform vec3 uSun;
        varying vec2 vUv; varying vec3 vN; varying vec3 vP;
        void main(){vec3 N=normalize(vN);vec3 S=normalize(uSun);float NdL=dot(N,S);float day=smoothstep(-0.20,0.22,NdL);vec4 dC=texture2D(uDay,vUv);vec4 nC=texture2D(uNight,vUv);nC.rgb*=2.6;vec4 col=mix(nC,dC,day);vec3 V=normalize(-vP);vec3 H=normalize(S+V);float sp=pow(max(dot(N,H),0.0),85.0);col.rgb+=vec3(0.14,0.28,0.5)*sp*day*0.5;float rim=1.0-abs(dot(N,V));float atm=pow(rim,3.3);vec3 aC=mix(vec3(0.05,0.1,0.38),vec3(0.22,0.52,1.0),NdL*0.5+0.5);col.rgb=mix(col.rgb,aC,atm*0.32*day);gl_FragColor=col;}`,
    })
  );
  eGroup.add(earth);

  clouds = new THREE.Mesh(new THREE.SphereGeometry(2.04, 64, 64),
    new THREE.MeshPhongMaterial({map: tCloud, transparent: true, opacity: 0.70, depthWrite: false, blending: THREE.NormalBlending}));
  eGroup.add(clouds);

  atmo = new THREE.Mesh(new THREE.SphereGeometry(2.18, 64, 64),
    new THREE.ShaderMaterial({
      uniforms: { uSun: { value: new THREE.Vector3(5, 1.5, 3).normalize() } },
      vertexShader: `varying vec3 vN;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vP=(modelViewMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader: `uniform vec3 uSun;varying vec3 vN;varying vec3 vP;void main(){vec3 V=normalize(-vP);float f=1.0-max(dot(vN,V),0.0);f=pow(f,2.3);float NdL=dot(vN,normalize(uSun))*0.5+0.5;vec3 col=mix(vec3(0.0,0.03,0.14),vec3(0.2,0.5,1.0),NdL);gl_FragColor=vec4(col,f*0.62);}`,
      transparent: true, blending: THREE.AdditiveBlending, side: THREE.FrontSide, depthWrite: false,
    }));
  eGroup.add(atmo);

  setupEarthDrag(mount);
}

function setupEarthDrag(mount) {
  mount.addEventListener('mousedown', e => {isDragging=true;prevDX=e.clientX;prevDY=e.clientY;velX=velY=0;mount.classList.add('dragging');});
  window.addEventListener('mousemove', e => {if(!isDragging)return;const dx=e.clientX-prevDX,dy=e.clientY-prevDY;velY=dx*DRAG_SENSITIVITY_X;velX=dy*DRAG_SENSITIVITY_Y;rotY+=velY;rotX+=velX;rotX=Math.max(-ROT_X_MAX,Math.min(ROT_X_MAX,rotX));prevDX=e.clientX;prevDY=e.clientY;});
  window.addEventListener('mouseup',()=>{isDragging=false;mount.classList.remove('dragging');});
  mount.addEventListener('touchstart', e => {isDragging=true;prevDX=e.touches[0].clientX;prevDY=e.touches[0].clientY;velX=velY=0;}, { passive: true });
  window.addEventListener('touchmove', e => {if(!isDragging)return;const dx=e.touches[0].clientX-prevDX,dy=e.touches[0].clientY-prevDY;velY=dx*DRAG_SENSITIVITY_X;velX=dy*DRAG_SENSITIVITY_Y;rotY+=velY;rotX+=velX;rotX=Math.max(-ROT_X_MAX,Math.min(ROT_X_MAX,rotX));prevDX=e.touches[0].clientX;prevDY=e.touches[0].clientY;});
  window.addEventListener('touchend', () => {isDragging=false;});
}

function finishLoad() {document.getElementById('loading').classList.add('done');}

function loop(ts) {
  requestAnimationFrame(loop);
  const t = ts * 0.001;
  drawStarfield(t);
  if (earth && eGroup) {
    if (!isDragging) {rotY+=velY;rotX+=velX;velY*=INERTIA_DAMPING;velX*=INERTIA_DAMPING;if(Math.abs(velY)<0.0001)rotY+=0.0005;}
    eGroup.rotation.y=rotY;eGroup.rotation.x=rotX;
    if(clouds)clouds.rotation.y+=0.00008;
    renderer.render(scene, cam);
  }
}

/* ZOOM */
function updateZoom() {
  const activeSlide = document.querySelector('.slide.active img');
  if (activeSlide) activeSlide.style.transform = `scale(${currentZoom})`;
}
document.getElementById('zoom-in').addEventListener('click', () => {currentZoom=Math.min(currentZoom+0.2,3);updateZoom();});
document.getElementById('zoom-out').addEventListener('click', () => {currentZoom=Math.max(currentZoom-0.2,1);updateZoom();});
document.getElementById('zoom-reset').addEventListener('click', () => {currentZoom=1;updateZoom();});
document.getElementById('stage').addEventListener('wheel', (e) => {e.preventDefault();currentZoom=e.deltaY<0?Math.min(currentZoom+0.1,3):Math.max(currentZoom-0.1,1);updateZoom();}, { passive: false });

/* CAROUSEL */
function goTo(n) {
  if (filteredIndices.length === 0) return;
  current = n % filteredIndices.length;
  if (current < 0) current += filteredIndices.length;
  currentZoom = 1;
  updateSlide();
}

function updateSlide() {
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === current));
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === current));
  document.querySelectorAll('.thumb').forEach((th, i) => {th.classList.toggle('on', i === current);if(i===current)th.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});});
  updateZoom();
}

document.addEventListener('DOMContentLoaded', () => {
  const stage = document.getElementById('stage');
  const dotsDiv = document.getElementById('dots');
  const thumbsDiv = document.getElementById('thumbs');

  images.forEach((img, idx) => {
    const slide = document.createElement('div');
    slide.className = 'slide' + (idx === 0 ? ' active' : '');
    slide.dataset.category = img.category;
    slide.innerHTML = `<img src="${img.src}" alt="${img.title}" loading="lazy" /><div class="slide-ov"><div class="slide-tag">${img.category.toUpperCase()}</div><div class="slide-title">${img.title}</div></div><div class="slide-num">${String(img.num).padStart(2,'0')} / ${images.length}</div>`;
    stage.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'dot' + (idx === 0 ? ' on' : '');
    dot.addEventListener('click', () => {current=idx;updateSlide();});
    dotsDiv.appendChild(dot);

    const thumb = document.createElement('div');
    thumb.className = 'thumb' + (idx === 0 ? ' on' : '');
    const thumbImg = document.createElement('img');
    thumbImg.src = img.src;
    thumbImg.alt = img.title;
    thumb.appendChild(thumbImg);
    thumb.addEventListener('click', () => {current=idx;updateSlide();});
    thumbsDiv.appendChild(thumb);
  });

  const filtersDiv = document.getElementById('filters');
  allCategories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === 'all' ? ' active' : '');
    btn.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (cat === 'all') {filteredIndices = images.map((_, i) => i);} 
      else {filteredIndices = images.map((img, i) => img.category === cat ? i : -1).filter(i => i >= 0);}
      document.querySelectorAll('.slide').forEach((slide, i) => {slide.style.display = filteredIndices.includes(i) ? 'block' : 'none';});
      current = 0;
      updateSlide();
    });
    filtersDiv.appendChild(btn);
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const activeCat = document.querySelector('.filter-btn.active').textContent.toLowerCase();
    const cat = activeCat === 'all' ? 'all' : activeCat;
    filteredIndices = images.map((img, i) => {
      const matchCat = cat === 'all' || img.category === cat;
      const matchSearch = !q || img.title.toLowerCase().includes(q);
      return matchCat && matchSearch ? i : -1;
    }).filter(i => i >= 0);
    document.querySelectorAll('.slide').forEach((slide, i) => {slide.style.display = filteredIndices.includes(i) ? 'block' : 'none';});
    current = 0;
    updateSlide();
  });

  document.getElementById('arr-n').addEventListener('click', () => goTo(current + 1));
  document.getElementById('arr-p').addEventListener('click', () => goTo(current - 1));

  document.addEventListener('keydown', e => {if(e.key==='ArrowRight')goTo(current+1);if(e.key==='ArrowLeft')goTo(current-1);});

  let touchX0 = 0;
  document.getElementById('stage').addEventListener('touchstart', e => {touchX0=e.touches[0].clientX;}, {passive:true});
  document.getElementById('stage').addEventListener('touchend', e => {const dx=e.changedTouches[0].clientX-touchX0;if(Math.abs(dx)>40){dx<0?goTo(current+1):goTo(current-1);}});

  initEarth();
  requestAnimationFrame(loop);
});

window.addEventListener('scroll', () => {document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 60);}, {passive:true});
window.addEventListener('load', () => {setTimeout(() => document.getElementById('loading').classList.add('done'), 1000);});

</script>

</body>
